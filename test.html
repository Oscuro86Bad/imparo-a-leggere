<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Collaudo — Imparo a Leggere</title>
<style>
  body { font-family: monospace; background:#111; color:#d4ffd4; padding:20px; }
  .ok { color:#7ED957; } .fail { color:#FF8A80; font-weight:bold; }
  h1 { color:#4A90D9; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>🧪 Collaudo automatico del motore</h1>
<pre id="out">In corso…</pre>
<script src="js/config.js?v=8"></script>
<script src="js/data/words.js?v=19"></script>
<script src="js/data/associations.js?v=8"></script>
<script src="js/state/store.js?v=8"></script>
<script src="js/engine/generator.js?v=10"></script>
<script>
(function () {
  const out = [];
  let pass = 0, fail = 0;
  IAL.Store.init(); // come fa app.js all'avvio
  function check(name, cond) {
    if (cond) { pass++; out.push('✔ ' + name); }
    else { fail++; out.push('✘ ' + name); }
  }

  // Profilo: vocali + P + M, sillabe PA PE PI PO PU MA ME MI MO MU
  const p = IAL.Store.createProfile('Test', '🐻');
  p.letters = { vowels: ['A','E','I','O','U'], consonants: ['P','M'] };
  p.syllables = { P: ['PA','PE','PI','PO','PU'], M: ['MA','ME','MI','MO','MU'] };
  p.flags = { doppie:false, gruppi:false, sc:false, gn:false, gli:false };
  p.settings = { wordType:'mixed', lengths:[2,3,4,5,6], categories:{letters:true,syllables:true,words:true}, level:3 };
  IAL.Store.setActive(p.id);
  IAL.Store.save();

  const E = IAL.Engine;

  // 1. Controllo lettere e combinazioni
  check('MAMMA bloccata senza doppie', !E.canShowWord(p, IAL.WORDS_BY_KEY.MAMMA));
  check('MAPPA bloccata senza doppie', !E.canShowWord(p, IAL.WORDS_BY_KEY.MAPPA));
  check('PALLA bloccata senza doppie', !E.canShowWord(p, IAL.WORDS_BY_KEY.PALLA));
  check('PANE bloccata (NE non studiata)', !E.canShowWord(p, IAL.WORDS_BY_KEY.PANE));
  check('PAPERA bloccata (RA non studiata)', !E.canShowWord(p, IAL.WORDS_BY_KEY.PAPERA));
  p.flags.doppie = true;
  check('MAMMA disponibile con doppie', E.canShowWord(p, IAL.WORDS_BY_KEY.MAMMA));
  check('MAPPA disponibile con doppie', E.canShowWord(p, IAL.WORDS_BY_KEY.MAPPA));
  p.flags.doppie = false;

  const entry = { w: 'TOPO', s: ['TO','PO'] };
  check('TOPO bloccata (T non abilitata)', !E.canShowWord(p, entry));
  const entry2 = { w: 'PAMI', s: ['PA','MI'] };
  check('PAMI valida (solo sillabe studiate)', E.canShowWord(p, entry2));

  // 2. Nessuna lettera non abilitata in 300 esercizi generati
  const enabled = ['A','E','I','O','U','P','M'];
  let leak = null;
  for (let i = 0; i < 300; i++) {
    const ex = E.nextReading(p, { categories:{letters:true,syllables:true,words:true}, wordType:'mixed', lengths:[2,3,4,5,6] });
    if (!ex) continue;
    const letters = IAL.lettersOf(ex.text);
    if (!letters.every(L => enabled.indexOf(L) !== -1)) { leak = ex.text; break; }
  }
  check('300 esercizi senza lettere non abilitate', leak === null);

  // 3. Le parole reali generate esistono nell'archivio, le inventate no
  let realOk = true, invOk = true, invLenOk = true;
  for (let i = 0; i < 200; i++) {
    const ex = E.nextReading(p, { categories:{letters:false,syllables:false,words:true}, wordType:'mixed', lengths:[3,4,5] });
    if (!ex) continue;
    if (ex.invented) {
      if (IAL.WORDS_BY_KEY[ex.text]) invOk = false;
      if ([3,4,5].indexOf(ex.text.length) === -1) invLenOk = false;
    } else if (!IAL.WORDS_BY_KEY[ex.text]) realOk = false;
  }
  check('Le parole reali appartengono all’archivio', realOk);
  check('Le parole inventate non esistono nell’archivio', invOk);
  check('Le parole inventate rispettano la lunghezza', invLenOk);

  // 4. Le inventate usano solo sillabe studiate
  let sylOk = true;
  for (let i = 0; i < 100; i++) {
    const ex = E.makeInvented(p, 4, []);
    if (!ex || !ex.invented) continue;
    let t = ex.text, idx = 0;
    while (idx < t.length) {
      const two = t.slice(idx, idx + 2), three = t.slice(idx, idx + 3);
      if (IAL.CONFIG.VOWELS.indexOf(t[idx]) !== -1) { idx += 1; continue; }
      if (IAL.SYLLABLE_ASSOC && ['P','M'].indexOf(t[idx]) !== -1 &&
          (p.syllables[t[idx]].indexOf(two) !== -1)) { idx += 2; continue; }
      if (t[idx] === 'Q' && p.syllables.Q && p.syllables.Q.indexOf(three) !== -1) { idx += 3; continue; }
      sylOk = false; break;
    }
  }
  check('Le inventate usano solo sillabe studiate', sylOk);

  // 5. Leggi e guarda: SOLO parole reali complete con immagine, sempre
  //    svincolata dalla lunghezza selezionata, mai ripetute di seguito
  let matchOk = true, matchLong = false, matchRepeat = false, prevM = '';
  for (let i = 0; i < 200; i++) {
    const ex = E.nextMatch(p, { wordType: 'invented', lengths: [2] }); // opzioni ignorate
    if (!ex) continue;
    const word = IAL.WORDS_BY_KEY[ex.text];
    if (ex.invented || !word || !word.img || ex.text !== ex.assocWord || !E.canShowWord(p, word)) { matchOk = false; break; }
    if (ex.text.length > 2) matchLong = true;
    if (ex.text === prevM) matchRepeat = true;
    prevM = ex.text;
  }
  check('LEGGI E GUARDA: solo parole reali complete con immagine (anche se impostate le inventate)', matchOk);
  check('LEGGI E GUARDA: svincolata dalla lunghezza selezionata (parole oltre 2 lettere)', matchLong);
  check('LEGGI E GUARDA: mai la stessa parola due volte di seguito', !matchRepeat);

  // 6. Coppie di vocali: mai lettere singole
  let pairOk = true;
  for (let i = 0; i < 100; i++) {
    const ex = E.nextReading(p, { categories:{letters:true,syllables:false,words:false}, wordType:'real', lengths:[2,3,4,5,6] });
    if (!ex) continue;
    if (ex.kind !== 'letter' || ex.text.length !== 2 || IAL.CONFIG.VOWELS.indexOf(ex.text[0]) === -1 || IAL.CONFIG.VOWELS.indexOf(ex.text[1]) === -1) { pairOk = false; break; }
  }
  check('Categoria lettere: solo coppie di vocali (minimo 2 lettere)', pairOk);

  // 6b. Sillaba studiata con consonante poi disattivata: mai proposta (bug RA)
  const p2 = IAL.Store.createProfile('Test2', '🐱');
  p2.letters = { vowels: ['A','E','I','O','U'], consonants: ['P','M','N'] };
  p2.syllables = { P: ['PA','PE'], M: ['MA','ME'], N: ['NA'], R: ['RA','RE'] };
  p2.flags = { doppie:false, gruppi:false, sc:false, gn:false, gli:false };
  p2.settings = { wordType:'mixed', lengths:[2,3,4,5,6], categories:{letters:true,syllables:true,words:true}, level:3 };
  IAL.Store.setActive(p2.id);
  IAL.Store.save();

  check('RA con R disattivata non è proponibile', !E.canShowSyllable(p2, 'RA', E.enabledLetters(p2)));
  let raLeak = null;
  for (let i = 0; i < 200; i++) {
    const ex = E.nextReading(p2, { categories:{letters:false,syllables:true,words:false}, wordType:'mixed', lengths:[2,3,4,5,6] });
    if (ex && ex.text.indexOf('RA') !== -1) { raLeak = ex.text; break; }
  }
  check('Categoria sillabe: mai RA con R disattivata' + (raLeak ? ' → "' + raLeak + '"' : ''), raLeak === null);
  let invLeak = null;
  for (let i = 0; i < 200; i++) {
    const ex = E.makeInvented(p2, 4, []);
    if (ex && ex.invented && ex.text.indexOf('RA') !== -1) { invLeak = ex.text; break; }
  }
  check('Inventate: mai RA con R disattivata' + (invLeak ? ' → "' + invLeak + '"' : ''), invLeak === null);
  const avail = E.availability(p2);
  check('availability: conta solo le sillabe con consonante attiva (5, non 7)', avail.syllables === 5);

  // 6c. Vedi e scegli: immagine + scelta multipla dell'inizio
  // (arricchisce le sillabe per avere parole complete disponibili)
  p2.syllables = { P: ['PA','PE','PI','PO','PU'], M: ['MA','ME','MI','MO','MU'], N: ['NA','NE','NI','NO','NU'], R: ['RA','RE'] };
  IAL.Store.save();
  let chOk = true, chDetail = '';
  for (let i = 0; i < 100; i++) {
    const ex = E.nextChoice(p2, { lengths: [2,3,4,5,6] });
    if (!ex) { chOk = false; chDetail = 'nessun esercizio'; break; }
    if (!ex.img || !ex.word) { chOk = false; chDetail = 'manca immagine/parola'; break; }
    if (!ex.options || ex.options.length < 2 || ex.options.length > 4) { chOk = false; chDetail = 'opzioni: ' + (ex.options || []).join('/'); break; }
    if (ex.options.indexOf(ex.syllable) === -1) { chOk = false; chDetail = 'corretta mancante'; break; }
    if (ex.options.some(o => o.length !== 2)) { chOk = false; chDetail = 'opzione non di 2 lettere'; break; }
    if (ex.options.some(o => ['P','M','N'].indexOf(o[0]) === -1)) { chOk = false; chDetail = 'opzione con consonante disattivata: ' + ex.options.join('/'); break; }
    if (IAL.WORDS_BY_KEY[ex.word].s[0] !== ex.syllable) { chOk = false; chDetail = 'sillaba errata per ' + ex.word; break; }
  }
  check('Vedi e scegli: opzioni valide (2-4), corretta inclusa, solo sillabe attive' + (chDetail ? ' → ' + chDetail : ''), chOk);

  // 6d. Vedi e scegli: basta l'inizio conosciuto, il resto può avere lettere nuove
  let relOk = true, relaxed = false;
  const okL = ['A','E','I','O','U','P','M','N'];
  for (let i = 0; i < 150; i++) {
    const ex = E.nextChoice(p2, { lengths: [2,3,4,5,6] });
    if (!ex) { relOk = false; break; }
    if (!ex.img || !ex.word) { relOk = false; break; }
    if (!E.canShowSyllable(p2, ex.syllable, E.enabledLetters(p2))) { relOk = false; break; }
    if (ex.options.indexOf(ex.syllable) === -1) { relOk = false; break; }
    if (IAL.lettersOf(ex.word).some(function (L) { return okL.indexOf(L) === -1; })) relaxed = true;
  }
  check('Vedi e scegli: l’inizio è sempre una sillaba studiata e attiva', relOk);
  check('Vedi e scegli: ammesse parole con lettere ancora da studiare (archivio ampliato)', relaxed);

  // 7. Disattivando tutto: zero esercizi
  p.letters = { vowels: [], consonants: [] };
  p.syllables = {};
  check('Nessuna lettera → nessun esercizio', E.nextReading(p, { categories:{letters:true,syllables:true,words:true}, wordType:'mixed', lengths:[2,3,4,5,6] }) === null);
  check('Nessuna lettera → nessun esercizio di ascolto', E.nextListen(p) === null);
  check('Nessuna lettera → nessuna associazione', E.nextMatch(p, { wordType:'mixed', lengths:[2,3,4,5,6] }) === null);

  // 8. Lunghezza selezionata
  p.letters = { vowels: ['A','E','I','O','U'], consonants: ['P','M','L','T','S','N','B','D','F','R','V','Z','C','G'] };
  p.syllables = {}; IAL.CONFIG.CONSONANTS.forEach(c => { if (c !== 'H') p.syllables[c] = IAL.cvSyllables(c); });
  p.flags = { doppie:true, gruppi:true, vc:true, sc:true, gn:true, gli:true };
  let lenOk = true;
  for (let i = 0; i < 300; i++) {
    const ex = E.nextReading(p, { categories:{letters:false,syllables:false,words:true}, wordType:'real', lengths:[4] });
    if (!ex) continue;
    if (ex.text.length !== 4) { lenOk = false; break; }
  }
  check('Filtro lunghezza rispettato (4 lettere)', lenOk);

  // 9. Parole con gruppi consonantici e doppie: valutazione senza errori
  let grpOk = true;
  ['TRENO', 'LIBRO', 'BUSTA', 'CAPRA', 'DRAGO', 'GRILLO', 'MOLLA', 'BURRO', 'ERBA', 'ORTO'].forEach(function (w) {
    if (!E.canShowWord(p, IAL.WORDS_BY_KEY[w])) grpOk = false;
  });
  check('Parole con gruppi consonantici valutabili e disponibili con flag attive', grpOk);

  // 10. Parole nuove dell'archivio: gating corretto
  p.letters = { vowels: ['A','E','I','O','U'], consonants: ['P','M'] };
  p.syllables = { P: ['PA','PE','PI','PO','PU'], M: ['MA','ME','MI','MO','MU'] };
  p.flags = { doppie: true, gruppi: true, sc: true, gn: true, gli: true };
  const pilOk = !E.canShowWord(p, IAL.WORDS_BY_KEY.PILA);   // richiede L
  const mamOk = E.canShowWord(p, IAL.WORDS_BY_KEY.MAMMA);   // doppie MA-MM-A... MA+MMA
  const apeOk = E.canShowWord(p, IAL.WORDS_BY_KEY.APE);     // vocali attive + PE studiata → disponibile
  check('PILA bloccata senza L', pilOk);
  check('MAMMA disponibile con doppie e MA/MMA', mamOk);
  check('APE disponibile con vocali e PE (parola con vocale iniziale)', apeOk);
  const newWordsOk = IAL.WORDS.length >= 170 && IAL.WORDS.filter(w => w.img).length >= 80;
  check('Archivio espanso: oltre 170 parole, oltre 80 con immagine (attuali: ' + IAL.WORDS.length + ' / ' + IAL.WORDS.filter(w => w.img).length + ')', newWordsOk);

  // 11. Attivare una consonante attiva automaticamente le sue sillabe CV
  const p3 = IAL.Store.createProfile('Test3', '🐹');
  p3.letters = { vowels: ['A','E','I','O','U'], consonants: [] };
  p3.syllables = {};
  IAL.Store.setActive(p3.id);
  IAL.Store.save();
  // simula il clic del genitore sul tile consonante P (stessa logica di parent.js)
  p3.letters.consonants.push('P');
  p3.syllables['P'] = IAL.cvSyllables('P').slice();
  const autoSyl = ['PA','PE','PI','PO','PU'].every(s => p3.syllables.P.indexOf(s) !== -1);
  check('Consonante attivata → sillabe CV attive in automatico (PA-PU)', autoSyl);
  // migratore: profilo con consonante attiva ma sillabe mai impostate → riempite al caricamento
  p3.letters.consonants = ['T'];
  p3.syllables = {};
  IAL.Store.save();
  IAL.Store.init(); // riesegue il migratore di load()
  const p3b = IAL.Store.active(); // riferimento ricaricato dal localStorage
  check('Migratore: consonante attiva senza sillabe → sillabe CV attive', Array.isArray(p3b.syllables.T) && p3b.syllables.T.indexOf('TA') !== -1);
  let dupOk = true;
  IAL.WORDS.forEach(function (e, i) {
    for (let j = i + 1; j < IAL.WORDS.length; j++) if (IAL.WORDS[j].w === e.w) dupOk = false;
  });
  check('Nessuna parola duplicata nell’archivio', dupOk);

  // 12. Il livello di progressione limita lunghezza e difficoltà in TUTTE le sezioni
  p.settings.level = 3;
  IAL.Store.save();
  let capOk = true;
  for (let i = 0; i < 200; i++) {
    const ex = E.nextReading(p, { categories:{letters:false,syllables:false,words:true}, wordType:'real', lengths:[2,3,4,5,6] });
    if (!ex) continue;
    const w = IAL.WORDS_BY_KEY[ex.text];
    if (ex.text.length > 4 || (w && (w.diff || 1) > 1)) { capOk = false; break; }
  }
  check('Livello 3: solo parole semplici fino a 4 lettere (cap)', capOk);
  p.settings.level = 6;
  IAL.Store.save();
  let cap6 = false;
  for (let i = 0; i < 400; i++) {
    const ex = E.nextReading(p, { categories:{letters:false,syllables:false,words:true}, wordType:'real', lengths:[2,3,4,5,6] });
    if (ex && ex.text.length >= 5) { cap6 = true; break; }
  }
  check('Livello 6: compaiono anche parole di 5-6 lettere', cap6);

  // 13. Solo sillabe attivate nelle categorie: SOLO LETTURA mostra solo sillabe,
  //     mentre LEGGI E GUARDA e DICO LA PAROLA restano a parole complete
  //     (sezioni svincolate dalle impostazioni, validi solo i vocaboli conosciuti)
  p.settings.level = 6;
  p.settings.categories = { letters: false, syllables: true, words: false };
  IAL.Store.save();
  let sylOnly = true, mWords = false, spWords = false;
  for (let i = 0; i < 100; i++) {
    const r = E.nextReading(p, { categories: p.settings.categories, wordType: 'mixed', lengths: [2,3,4,5,6] });
    if (r && r.kind !== 'syllable') { sylOnly = false; break; }
    const m = E.nextMatch(p);
    if (m) {
      const w = IAL.WORDS_BY_KEY[m.text];
      if (!w || !w.img || !E.canShowWord(p, w)) { sylOnly = false; break; }
      mWords = true;
    }
    const sp = E.nextSpeech(p);
    if (sp) {
      const w = IAL.WORDS_BY_KEY[sp.text];
      if (!w || !E.canShowWord(p, w)) { sylOnly = false; break; }
      spWords = true;
    }
    const c = E.nextChoice(p, { lengths: [2,3,4,5,6] });
    if (c && !E.canShowSyllable(p, c.syllable, E.enabledLetters(p))) { sylOnly = false; break; }
  }
  check('Solo sillabe: SOLO LETTURA mostra solo sillabe, VEDI E SCEGLI resta valido', sylOnly);
  check('Solo sillabe: LEGGI E GUARDA mostra comunque parole complete con immagine', mWords);
  check('Solo sillabe: DICO LA PAROLA mostra comunque parole complete', spWords);

  // 14. DICO LA PAROLA: solo parole reali complete, svincolata dalla lunghezza,
  //     mai la stessa parola due volte di seguito
  let spOk = true, spLong = false, spRepeat = false, prevSp = '';
  for (let i = 0; i < 200; i++) {
    const ex = E.nextSpeech(p);
    if (!ex) continue;
    const w = IAL.WORDS_BY_KEY[ex.text];
    if (ex.invented || !w || !E.canShowWord(p, w)) { spOk = false; break; }
    if (ex.text.length > 2) spLong = true;
    if (ex.text === prevSp) spRepeat = true;
    prevSp = ex.text;
  }
  check('DICO LA PAROLA: solo parole reali complete leggibili', spOk);
  check('DICO LA PAROLA: svincolata dalla lunghezza selezionata', spLong);
  check('DICO LA PAROLA: mai la stessa parola due volte di seguito', !spRepeat);

  // 15. PAROLE MIE: lista del genitore, ordine casuale, mai ripetute di seguito
  let cwOk = true, cwRep = false, cwPrev = '';
  const cwList = ['MAMMA', 'GATTO', 'FORCHETTA'];
  const savedCats = p.settings.categories;
  p.customWords = cwList.slice();
  p.settings.categories = { letters: false, syllables: false, words: false }; // non influisce
  IAL.Store.save();
  for (let i = 0; i < 100; i++) {
    const ex = E.nextCustom(p);
    if (!ex) { cwOk = false; break; }
    if (cwList.indexOf(ex.text) === -1) { cwOk = false; break; }  // solo parole inserite
    if (ex.text === cwPrev) cwRep = true;
    cwPrev = ex.text;
  }
  p.settings.categories = savedCats;
  IAL.Store.save();
  check('PAROLE MIE: propone solo le parole inserite dal genitore (anche con tutto disattivato)', cwOk);
  check('PAROLE MIE: mai la stessa parola due volte di seguito', !cwRep);
  p.customWords = [];
  IAL.Store.save();
  check('PAROLE MIE: lista vuota → nessun esercizio', E.nextCustom(p) === null);

  // 16. Vocali + L/P/M/T: molte più parole reali (incluse TATA, TUTU, TETTO…)
  const pT = IAL.Store.createProfile('TestT', '🐯');
  pT.letters = { vowels: ['A','E','I','O','U'], consonants: ['L','P','M','T'] };
  pT.syllables = {};
  ['L','P','M','T'].forEach(function (c) { pT.syllables[c] = IAL.cvSyllables(c).slice(); });
  pT.flags = { doppie: true, gruppi: false, sc: false, gn: false, gli: false };
  pT.settings = { wordType:'mixed', lengths:[2,3,4,5,6], categories:{letters:true,syllables:true,words:true}, level:6 };
  pT.customWords = [];
  IAL.Store.setActive(pT.id);
  IAL.Store.save();
  const tPool = E.realWords(pT, null, true).map(function (e) { return e.w; });
  const wanted = ['TUTA','TATA','TUTU','TETTO','TATTO','TUTTO','TAPPO','LETTO','LOTO','LUME','MUTA','MOLO','MOTO','MULO','POMATA','TELA','TELE'];
  const missing = wanted.filter(function (w) { return tPool.indexOf(w) === -1; });
  check('Vocali + L/P/M/T: ' + tPool.length + ' parole reali disponibili (mancanti: ' + (missing.join(',') || 'nessuna') + ')',
    missing.length === 0 && tPool.length >= 40);

  // Con le sole vocali + T le parole reali non sono più solo TUTA
  const pTonly = IAL.Store.createProfile('TestT2', '🐯');
  pTonly.letters = { vowels: ['A','E','I','O','U'], consonants: ['T'] };
  pTonly.syllables = { T: IAL.cvSyllables('T').slice() };
  pTonly.flags = { doppie: true, gruppi: false, sc: false, gn: false, gli: false };
  pTonly.settings = { wordType:'mixed', lengths:[2,3,4,5,6], categories:{letters:true,syllables:true,words:true}, level:6 };
  const tOnly = E.realWords(pTonly, null, true).map(function (e) { return e.w; });
  check('Vocali + T: più parole reali oltre TUTA [' + tOnly.join(',') + ']', tOnly.length >= 5);

  // Parole inventate curate: TATU (suggerita) e combinazioni simili
  check('Inventate curate presenti (TATU, TATO, MIMI, LOLO…)',
    (IAL.INVENTED_WORDS || []).length >= 20 &&
    IAL.INVENTED_WORDS.some(function (e) { return e.w === 'TATU'; }) &&
    !IAL.WORDS_BY_KEY['TATU']);
  const pInv = IAL.Store.createProfile('TestInv', '🦊');
  pInv.letters = { vowels: ['A','E','I','O','U'], consonants: ['T','L','P','M'] };
  pInv.syllables = {};
  ['T','L','P','M'].forEach(function (c) { pInv.syllables[c] = IAL.cvSyllables(c).slice(); });
  pInv.flags = { doppie: false, gruppi: false, sc: false, gn: false, gli: false };
  pInv.settings = { wordType:'invented', lengths:[4], categories:{letters:false,syllables:false,words:true}, level:6 };
  let seenTatu = false, invBadLetter = false;
  for (let i = 0; i < 300; i++) {
    const ex = E.makeInvented(pInv, 4, []);
    if (!ex || !ex.invented) continue;
    if (ex.text === 'TATU') seenTatu = true;
    if (![...ex.text].every(function (c) { return ['A','E','I','O','U','T','L','P','M'].indexOf(c) !== -1; })) invBadLetter = true;
  }
  check('Inventate curate generate davvero (TATU esce)', seenTatu);
  check('Inventate: solo lettere attive (vocali + L/P/M/T)', !invBadLetter);

  // 17. ASCOLTA E SELEZIONA: la parola sentita è tra le scelte, tutte leggibili
  IAL.Store.setActive(pT.id);
  let asOk = true, asDetail = '', asFour = 0, asRepeat = false, prevAs = '';
  for (let i = 0; i < 200; i++) {
    const ex = E.nextListen(pT);
    if (!ex) { asOk = false; asDetail = 'nessun esercizio'; break; }
    if (!ex.word || !Array.isArray(ex.options)) { asOk = false; asDetail = 'struttura'; break; }
    if (ex.options.length === 4) asFour++;
    if (ex.options.length < 2) { asOk = false; asDetail = 'troppe poche scelte'; break; }
    if (ex.options.indexOf(ex.word) === -1) { asOk = false; asDetail = 'corretta mancante'; break; }
    if (new Set(ex.options).size !== ex.options.length) { asOk = false; asDetail = 'duplicati'; break; }
    const word = IAL.WORDS_BY_KEY[ex.word];
    if (!word || !E.canShowWord(pT, word)) { asOk = false; asDetail = 'parola non leggibile ' + ex.word; break; }
    if (ex.options.some(function (o) {
      const w = IAL.WORDS_BY_KEY[o];
      return !w || !E.canShowWord(pT, w);
    })) { asOk = false; asDetail = 'distrattore non leggibile'; break; }
    if (ex.word === prevAs) asRepeat = true;
    prevAs = ex.word;
  }
  check('Ascolta e seleziona: scelte reali e leggibili, corretta inclusa' + (asDetail ? ' → ' + asDetail : ''), asOk);
  check('Ascolta e seleziona: 4 scelte quando l’archivio lo permette (' + asFour + '/200)', asFour >= 190);
  check('Ascolta e seleziona: mai la stessa parola due volte di seguito', !asRepeat);

  out.push('');
  out.push(fail === 0 ? 'TUTTI I TEST SUPERATI (' + pass + ')' : 'TEST FALLITI: ' + fail + ' su ' + (pass + fail));
  document.getElementById('out').textContent = out.join('\n');
})();
</script>
