<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" role="img" aria-label="Tettoia">
  <defs>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0593f"/>
      <stop offset="1" stop-color="#b03a25"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b07a4a"/>
      <stop offset="1" stop-color="#8a5a33"/>
    </linearGradient>
  </defs>

  <ellipse cx="100" cy="154" rx="84" ry="9" fill="#000" opacity="0.07"/>

  <!-- pali di sostegno -->
  <rect x="42" y="86" width="12" height="64" rx="4" fill="url(#post)" stroke="#6d4526" stroke-width="2.5"/>
  <rect x="146" y="86" width="12" height="64" rx="4" fill="url(#post)" stroke="#6d4526" stroke-width="2.5"/>

  <!-- traversa sotto la copertura -->
  <rect x="30" y="82" width="140" height="10" rx="5" fill="#7c512e" stroke="#5f3c20" stroke-width="2"/>

  <!-- copertura a una falda -->
  <path d="M38 54 L162 54 L184 86 L16 86 Z" fill="url(#canopy)" stroke="#8f2413" stroke-width="4" stroke-linejoin="round"/>

  <!-- file di tegole -->
  <g stroke="#8f2413" stroke-width="2.2" opacity="0.7" fill="none">
    <path d="M34 62 L166 62"/>
    <path d="M29 71 L171 71"/>
    <path d="M24 79 L176 79"/>
  </g>
  <g fill="#f0775f" opacity="0.5">
    <circle cx="60" cy="58" r="2.6"/>
    <circle cx="100" cy="58" r="2.6"/>
    <circle cx="140" cy="58" r="2.6"/>
    <circle cx="50" cy="75" r="2.6"/>
    <circle cx="100" cy="75" r="2.6"/>
    <circle cx="150" cy="75" r="2.6"/>
  </g>

  <!-- bordo frontale della copertura -->
  <rect x="12" y="84" width="176" height="10" rx="5" fill="#9e2c19"/>
  <rect x="12" y="84" width="176" height="4" rx="2" fill="#c94a34"/>

  <!-- tavolino sotto la tettoia -->
  <ellipse cx="100" cy="146" rx="34" ry="5" fill="#000" opacity="0.08"/>
  <rect x="66" y="116" width="68" height="8" rx="4" fill="#c98a52" stroke="#8a5a33" stroke-width="2"/>
  <rect x="72" y="124" width="7" height="22" rx="3" fill="#a9713f"/>
  <rect x="121" y="124" width="7" height="22" rx="3" fill="#a9713f"/>
  <rect x="92" y="104" width="16" height="12" rx="3" fill="#ffffff" stroke="#c9c2b8" stroke-width="2"/>
  <path d="M108 108 q8 0 8 5 q0 5 -8 5" fill="none" stroke="#c9c2b8" stroke-width="2"/>
</svg>
