<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Faro sul mare con fascio di luce">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9dcf5"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57b8e8"/>
      <stop offset="1" stop-color="#16679d"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#cfd6dd"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d8f93"/>
      <stop offset="1" stop-color="#5b5e63"/>
    </linearGradient>
    <clipPath id="frame"><rect x="6" y="6" width="188" height="188" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="6" y="6" width="188" height="188" fill="url(#sky)"/>
    <circle cx="42" cy="42" r="16" fill="#ffe08a"/>
    <circle cx="42" cy="42" r="23" fill="#ffe08a" opacity="0.3"/>

    <!-- mare -->
    <rect x="6" y="132" width="188" height="62" fill="url(#sea)"/>
    <path d="M6 138 Q 30 130 54 138 T 102 138 T 150 138 T 194 138 L 194 148 L 6 148 Z" fill="#8ed7f4" opacity="0.55"/>
    <path d="M6 160 Q 34 152 62 160 T 118 160 T 174 160 T 194 158" stroke="#bfe9fb" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M6 176 Q 36 168 66 176 T 126 176 T 194 174" stroke="#bfe9fb" stroke-width="4" fill="none" opacity="0.5"/>

    <!-- scogliera -->
    <path d="M58 194 L66 150 Q 82 138 106 142 Q 132 146 144 160 L 152 194 Z" fill="url(#rock)"/>
    <path d="M70 160 Q 86 150 104 154" stroke="#a7aaae" stroke-width="4" fill="none" opacity="0.7"/>

    <!-- fascio di luce -->
    <path d="M96 66 L16 34 L16 96 Z" fill="#ffe58a" opacity="0.55"/>
    <path d="M104 66 L184 40 L184 92 Z" fill="#ffe58a" opacity="0.35"/>

    <!-- torre -->
    <path d="M82 150 L88 84 L112 84 L118 150 Z" fill="url(#tower)" stroke="#9aa3ab" stroke-width="2.5"/>
    <path d="M87 108 L113 108 L114 124 L86 124 Z" fill="#e74c3c"/>
    <path d="M85 138 L115 138 L116 150 L84 150 Z" fill="#e74c3c"/>
    <!-- balcone -->
    <rect x="80" y="80" width="40" height="8" rx="3" fill="#4a4f55"/>
    <rect x="84" y="72" width="32" height="10" rx="3" fill="#37414a"/>
    <!-- lanterna -->
    <rect x="88" y="58" width="24" height="18" rx="4" fill="#2f3b45"/>
    <rect x="92" y="61" width="16" height="12" rx="2" fill="#ffe066"/>
    <circle cx="100" cy="67" r="5" fill="#fff6c2"/>
    <path d="M88 54 L112 54 L100 46 Z" fill="#37414a"/>
    <circle cx="100" cy="45" r="3" fill="#f0b429"/>

    <!-- gabbiani -->
    <path d="M142 54 q 8 -7 16 0 q 8 -7 16 0" stroke="#4a5a66" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M40 108 q 6 -5 12 0 q 6 -5 12 0" stroke="#4a5a66" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="6" y="6" width="188" height="188" rx="22" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.65"/>
</svg>
