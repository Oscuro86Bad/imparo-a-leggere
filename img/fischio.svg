<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Fischietto da arbitro con onde sonore">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="0.5" stop-color="#c4ccd4"/>
      <stop offset="1" stop-color="#8f99a3"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#aeb8c2"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="192" height="192" rx="24" fill="#eef7ff"/>
  <circle cx="100" cy="104" r="78" fill="#d9efff"/>

  <!-- onde sonore -->
  <g stroke="#4aa3df" fill="none" stroke-linecap="round">
    <path d="M146 60 q 16 -12 30 -4" stroke-width="5"/>
    <path d="M142 44 q 24 -18 46 -6" stroke-width="5" opacity="0.75"/>
    <path d="M150 76 q 10 -8 20 -5" stroke-width="4" opacity="0.6"/>
  </g>

  <!-- corpo del fischietto -->
  <path d="M42 120 Q 42 92 74 88 L 132 88 Q 158 88 158 112 Q 158 138 128 138 L 62 138 Q 42 138 42 120 Z"
        fill="url(#body)" stroke="#73808c" stroke-width="3"/>
  <!-- beccuccio -->
  <path d="M42 112 L18 100 Q 12 98 12 106 L 12 122 Q 12 130 20 128 L 42 120 Z"
        fill="#3b4650" stroke="#2a333b" stroke-width="2.5"/>
  <!-- parte superiore -->
  <path d="M70 88 Q 96 70 124 88 Z" fill="url(#metal)" stroke="#73808c" stroke-width="2.5"/>
  <!-- foro d'aria -->
  <ellipse cx="124" cy="104" rx="13" ry="9" fill="#5e6a75"/>
  <ellipse cx="124" cy="102" rx="9" ry="5" fill="#2f3a44"/>
  <!-- anello -->
  <circle cx="52" cy="146" r="14" fill="none" stroke="#8c96a0" stroke-width="7"/>
  <circle cx="52" cy="146" r="14" fill="none" stroke="#e8edf1" stroke-width="3"/>
  <!-- riflesso -->
  <path d="M58 100 Q 92 94 128 100" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M62 126 Q 94 132 124 126" stroke="#7f8a95" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
</svg>
