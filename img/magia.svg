<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Magia">
  <defs>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="wand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d774"/>
      <stop offset="1" stop-color="#d99a2b"/>
    </linearGradient>
  </defs>

  <!-- cappello da mago (a punta) -->
  <ellipse cx="82" cy="172" rx="70" ry="9" fill="#000" opacity="0.07"/>
  <path d="M38 152 C 52 116, 80 78, 104 44 C 112 33, 127 35, 124 49 C 119 79, 104 118, 98 152 Z"
        fill="url(#hat)" stroke="#4c1d95" stroke-width="3"/>
  <ellipse cx="68" cy="153" rx="60" ry="16" fill="#6d28d9" stroke="#4c1d95" stroke-width="3"/>
  <ellipse cx="68" cy="150" rx="52" ry="10" fill="#8b5cf6"/>

  <!-- stelline sul cappello -->
  <g fill="#ffd54f">
    <g transform="translate(70 118) scale(0.55)">
      <polygon points="0,-16 3.82,-5.26 15.22,-4.94 6.18,2.01 9.40,12.94 0,6.5 -9.40,12.94 -6.18,2.01 -15.22,-4.94 -3.82,-5.26"/>
    </g>
    <g transform="translate(92 92) scale(0.42)">
      <polygon points="0,-16 3.82,-5.26 15.22,-4.94 6.18,2.01 9.40,12.94 0,6.5 -9.40,12.94 -6.18,2.01 -15.22,-4.94 -3.82,-5.26"/>
    </g>
    <g transform="translate(106 62) scale(0.34)">
      <polygon points="0,-16 3.82,-5.26 15.22,-4.94 6.18,2.01 9.40,12.94 0,6.5 -9.40,12.94 -6.18,2.01 -15.22,-4.94 -3.82,-5.26"/>
    </g>
  </g>

  <!-- bacchetta magica -->
  <path d="M118 176 L152 112" stroke="url(#wand)" stroke-width="11" stroke-linecap="round"/>
  <path d="M122 168 L148 118" stroke="#fff3c4" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

  <!-- stella in punta -->
  <g transform="translate(158 100) scale(1.25)">
    <polygon points="0,-16 3.82,-5.26 15.22,-4.94 6.18,2.01 9.40,12.94 0,6.5 -9.40,12.94 -6.18,2.01 -15.22,-4.94 -3.82,-5.26"
             fill="#ffd54f" stroke="#f0a500" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- scintille -->
  <g fill="#ffd54f">
    <path transform="translate(150 46) scale(0.85)" d="M0,-10 Q1.6,-1.6 10,0 Q1.6,1.6 0,10 Q-1.6,1.6 -10,0 Q-1.6,-1.6 0,-10"/>
    <path transform="translate(178 150) scale(0.7)" d="M0,-10 Q1.6,-1.6 10,0 Q1.6,1.6 0,10 Q-1.6,1.6 -10,0 Q-1.6,-1.6 0,-10"/>
  </g>
  <g fill="#ff8fb1">
    <path transform="translate(184 62) scale(0.7)" d="M0,-10 Q1.6,-1.6 10,0 Q1.6,1.6 0,10 Q-1.6,1.6 -10,0 Q-1.6,-1.6 0,-10"/>
    <path transform="translate(128 26) scale(0.55)" d="M0,-10 Q1.6,-1.6 10,0 Q1.6,1.6 0,10 Q-1.6,1.6 -10,0 Q-1.6,-1.6 0,-10"/>
  </g>
  <g fill="#6ee7f9">
    <path transform="translate(166 172) scale(0.6)" d="M0,-10 Q1.6,-1.6 10,0 Q1.6,1.6 0,10 Q-1.6,1.6 -10,0 Q-1.6,-1.6 0,-10"/>
    <path transform="translate(112 30) scale(0.5)" d="M0,-10 Q1.6,-1.6 10,0 Q1.6,1.6 0,10 Q-1.6,1.6 -10,0 Q-1.6,-1.6 0,-10"/>
  </g>
  <g fill="#ffffff">
    <circle cx="140" cy="120" r="3"/>
    <circle cx="182" cy="108" r="2.5"/>
    <circle cx="160" cy="66" r="2.5"/>
