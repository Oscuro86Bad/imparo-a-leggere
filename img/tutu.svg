<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Tutù">
  <defs>
    <linearGradient id="tulle1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbcfe8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="tulle2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="tulle3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbcfe8"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
  </defs>

  <ellipse cx="100" cy="184" rx="72" ry="8" fill="#000" opacity="0.07"/>

  <!-- gonna a strati: tutù -->
  <path d="M68 82 Q42 128 20 166 Q66 156 100 166 Q134 156 180 166 Q158 128 132 82 Z"
