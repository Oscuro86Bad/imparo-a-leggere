<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Nutria marrone vicino all'acqua">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeeff"/>
      <stop offset="1" stop-color="#effbff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fc7ee"/>
      <stop offset="1" stop-color="#2a7fb3"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9744b"/>
      <stop offset="1" stop-color="#7a4f2d"/>
    </linearGradient>
    <clipPath id="frame"><rect x="6" y="6" width="188" height="188" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="6" y="6" width="188" height="188" fill="url(#sky)"/>
    <circle cx="158" cy="40" r="14" fill="#ffe08a"/>
    <!-- canne -->
    <g stroke="#4d9a5b" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M22 140 L26 78"/><path d="M34 144 L36 88"/><path d="M46 146 L44 96"/>
    </g>
    <g fill="#7fbf68">
      <ellipse cx="26" cy="82" rx="5" ry="12" transform="rotate(18 26 82)"/>
      <ellipse cx="37" cy="94" rx="4" ry="10" transform="rotate(-14 37 94)"/>
    </g>
    <!-- acqua -->
    <rect x="6" y="142" width="188" height="52" fill="url(#water)"/>
    <path d="M6 148 Q 34 140 62 148 T 118 148 T 174 148 T 194 146" stroke="#aee5fa" stroke-width="4" fill="none" opacity="0.75"/>

    <!-- corpo -->
    <ellipse cx="100" cy="126" rx="50" ry="34" fill="url(#fur)"/>
    <!-- testa -->
    <circle cx="136" cy="100" r="30" fill="url(#fur)"/>
    <!-- orecchie -->
    <circle cx="120" cy="74" r="9" fill="#8a5d38"/>
    <circle cx="150" cy="74" r="9" fill="#8a5d38"/>
    <circle cx="120" cy="74" r="4.5" fill="#5e3c22"/>
    <circle cx="150" cy="74" r="4.5" fill="#5e3c22"/>
    <!-- muso -->
    <ellipse cx="158" cy="108" rx="17" ry="13" fill="#c69a73"/>
    <ellipse cx="166" cy="104" rx="5" ry="4" fill="#3a2a1e"/>
    <path d="M158 116 q 4 4 8 0" stroke="#4a3323" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- baffi -->
    <g stroke="#4a3323" stroke-width="2" stroke-linecap="round">
      <path d="M168 108 L186 102"/><path d="M168 112 L186 114"/>
      <path d="M162 118 L174 128"/>
    </g>
    <!-- occhio -->
    <circle cx="142" cy="94" r="6" fill="#ffffff"/>
    <circle cx="144" cy="95" r="3.4" fill="#241a12"/>
    <circle cx="145" cy="93.5" r="1.2" fill="#ffffff"/>
    <!-- zampa -->
    <path d="M92 150 q 8 12 18 10" stroke="#5e3c22" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- coda -->
    <path d="M54 132 q -22 -4 -26 14 q 14 8 28 -2" fill="#6b452a"/>
    <!-- pelo chiaro -->
    <path d="M84 140 Q 100 148 118 140" stroke="#c69a73" stroke-width="5" fill="none" opacity="0.7" stroke-linecap="round"/>
    <!-- bollicine -->
    <g fill="#d9f4ff" opacity="0.9">
      <circle cx="38" cy="166" r="4"/><circle cx="50" cy="176" r="6"/><circle cx="64" cy="168" r="3"/>
    </g>
  </g>
  <rect x="6" y="6" width="188" height="188" rx="22" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.6"/>
</svg>
