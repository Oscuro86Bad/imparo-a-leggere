<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Montagna con bandierina sulla cima e linea della quota">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe8fb"/>
      <stop offset="1" stop-color="#f2fbff"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb3c2"/>
      <stop offset="1" stop-color="#5f7484"/>
    </linearGradient>
    <linearGradient id="rock2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3d2dc"/>
      <stop offset="1" stop-color="#8499a8"/>
    </linearGradient>
    <clipPath id="frame"><rect x="6" y="6" width="188" height="188" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="6" y="6" width="188" height="188" fill="url(#sky)"/>
    <circle cx="44" cy="40" r="15" fill="#ffe08a"/>
    <circle cx="44" cy="40" r="22" fill="#ffe08a" opacity="0.3"/>

    <!-- montagne lontane -->
    <path d="M-6 156 L44 84 L92 156 Z" fill="url(#rock2)" opacity="0.75"/>
    <!-- montagna principale -->
    <path d="M18 178 L100 44 L184 178 Z" fill="url(#rock)" stroke="#4d6170" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- neve in cima -->
    <path d="M100 44 L120 76 L110 80 L102 70 L94 80 L84 74 Z" fill="#ffffff"/>
    <!-- cresta -->
    <path d="M100 44 L88 178" stroke="#4d6170" stroke-width="2" opacity="0.35" fill="none"/>
    <!-- neve a lingue -->
    <path d="M76 96 q 12 10 6 22 q -10 -4 -14 -14 Z" fill="#ffffff" opacity="0.85"/>
    <path d="M124 88 q 10 12 4 20 q -10 -4 -14 -12 Z" fill="#ffffff" opacity="0.75"/>

    <!-- asta e bandierina sulla cima -->
    <path d="M100 44 L100 18" stroke="#5a4632" stroke-width="4" stroke-linecap="round"/>
    <path d="M100 18 L128 26 L100 36 Z" fill="#e74c3c" stroke="#b33127" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="100" cy="44" r="4" fill="#5a4632"/>

    <!-- linea tratteggiata della quota -->
    <path d="M24 148 L176 148" stroke="#ff9f1c" stroke-width="3.5" stroke-dasharray="9 8" stroke-linecap="round"/>
    <path d="M24 148 l 8 -7 v 14 z" fill="#ff9f1c"/>
    <path d="M176 148 l -8 -7 v 14 z" fill="#ff9f1c"/>

    <!-- nuvole -->
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="148" cy="62" rx="20" ry="10"/>
      <ellipse cx="162" cy="58" rx="14" ry="9"/>
      <ellipse cx="48" cy="108" rx="16" ry="8"/>
    </g>
    <!-- abeti -->
    <g fill="#3e8e5a">
      <path d="M42 178 L54 148 L66 178 Z"/>
      <path d="M140 178 L150 154 L160 178 Z"/>
    </g>
  </g>
  <rect x="6" y="6" width="188" height="188" rx="22" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.6"/>
</svg>
