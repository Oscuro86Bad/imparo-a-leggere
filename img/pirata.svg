<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" role="img" aria-label="Pirata con benda sull'occhio e spada">
  <defs>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e9ee"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c6d2"/>
      <stop offset="0.5" stop-color="#eef3f7"/>
      <stop offset="1" stop-color="#9fadba"/>
    </linearGradient>
    <linearGradient id="bandana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0574f"/>
      <stop offset="1" stop-color="#c02e28"/>
    </linearGradient>
    <clipPath id="torso">
      <path d="M62 150 Q100 136 138 150 L142 206 Q100 218 58 206 Z"/>
    </clipPath>
  </defs>

  <!-- ombra -->
  <ellipse cx="100" cy="262" rx="54" ry="8" fill="#000" opacity="0.08"/>

  <!-- gambe -->
  <path d="M78 196 L74 242" stroke="#2f3b52" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M122 196 L126 242" stroke="#2f3b52" stroke-width="26" stroke-linecap="round" fill="none"/>
  <!-- stivali -->
  <ellipse cx="70" cy="250" rx="20" ry="10" fill="#1b1b1b"/>
  <ellipse cx="130" cy="250" rx="20" ry="10" fill="#1b1b1b"/>
  <ellipse cx="64" cy="248" rx="7" ry="4" fill="#3a3a3a"/>
  <ellipse cx="124" cy="248" rx="7" ry="4" fill="#3a3a3a"/>

  <!-- braccio sinistro lungo il corpo -->
  <path d="M66 160 L50 196" stroke="#e74c3c" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M50 196 L44 220" stroke="#f6dcc8" stroke-width="15" stroke-linecap="round" fill="none"/>
  <circle cx="42" cy="226" r="10" fill="#f6dcc8"/>

  <!-- corpo: maglietta a righe -->
  <path d="M62 150 Q100 136 138 150 L142 206 Q100 218 58 206 Z" fill="url(#shirt)"/>
  <g clip-path="url(#torso)" fill="#e74c3c">
    <rect x="50" y="152" width="100" height="9"/>
    <rect x="50" y="170" width="100" height="9"/>
    <rect x="50" y="188" width="100" height="9"/>
    <rect x="50" y="204" width="100" height="9"/>
  </g>
  <!-- cintura -->
  <rect x="58" y="200" width="84" height="14" rx="4" fill="#7a4a22"/>
  <rect x="92" y="199" width="16" height="16" rx="4" fill="#f0b429" stroke="#c88a12" stroke-width="2"/>

  <!-- spada (dietro la mano) -->
  <g>
    <path d="M160 116 C 176 92 186 64 181 38 C 170 54 162 76 154 98 Z"
          fill="url(#blade)" stroke="#8d9dab" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M170 100 C 177 82 181 62 180 48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M146 108 Q 160 100 172 112" stroke="#f0b429" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="150" y="110" width="9" height="20" rx="4" fill="#8b5e33" transform="rotate(-32 154 120)"/>
  </g>

  <!-- braccio destro alzato (impugna la spada) -->
  <path d="M136 158 L152 132" stroke="#e74c3c" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M152 132 L157 120" stroke="#f6dcc8" stroke-width="15" stroke-linecap="round" fill="none"/>
  <circle cx="159" cy="116" r="11" fill="#f6dcc8"/>

  <!-- orecchie -->
  <circle cx="57" cy="94" r="9" fill="#f6dcc8"/>
  <circle cx="143" cy="94" r="9" fill="#f6dcc8"/>
  <!-- orecchino -->
  <circle cx="149" cy="105" r="5.5" fill="#f0b429" stroke="#c88a12" stroke-width="2"/>

  <!-- testa -->
  <circle cx="100" cy="94" r="45" fill="#f6dcc8"/>

  <!-- benda: cintura nera sull'occhio sinistro (dall'alto) -->
  <path d="M66 80 L96 90" stroke="#1b1b1b" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 88 L136 78" stroke="#1b1b1b" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="82" cy="94" rx="16" ry="13" fill="#1b1b1b"/>
  <ellipse cx="78" cy="90" rx="5" ry="3.5" fill="#4a4a4a" opacity="0.7"/>

  <!-- occhio visibile -->
  <ellipse cx="120" cy="95" rx="11" ry="10" fill="#ffffff"/>
  <circle cx="121" cy="96" r="5" fill="#2b2b2b"/>
  <circle cx="123" cy="94" r="1.8" fill="#ffffff"/>
  <!-- sopracciglio -->
  <path d="M108 78 Q 120 72 132 78" stroke="#5b3a22" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- naso e sorriso -->
  <path d="M100 100 q 5 8 -2 10" stroke="#dcaa8c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M86 118 q 14 14 30 0" stroke="#a8503f" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- bandana rossa in testa -->
  <path d="M55 88 Q 66 40 100 40 Q 134 40 145 88 Q 122 72 100 72 Q 78 72 55 88 Z"
        fill="url(#bandana)" stroke="#96201b" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="145" cy="84" r="9" fill="#d63b34" stroke="#96201b" stroke-width="2.5"/>
  <path d="M150 88 q 14 6 18 20 q -14 -2 -22 -12 Z" fill="#d63b34" stroke="#96201b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M148 92 q 10 12 10 24 q -12 -8 -16 -18 Z" fill="#c02e28" stroke="#96201b" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- pois sulla bandana -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="78" cy="62" r="3"/>
    <circle cx="100" cy="54" r="3"/>
    <circle cx="122" cy="62" r="3"/>
    <circle cx="66" cy="78" r="2.5"/>
    <circle cx="134" cy="78" r="2.5"/>
  </g>
</svg>
