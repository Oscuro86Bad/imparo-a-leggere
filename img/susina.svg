<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Susina viola con foglia verde">
  <defs>
    <radialGradient id="plum" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#a86bd6"/>
      <stop offset="0.55" stop-color="#7b3fb0"/>
      <stop offset="1" stop-color="#4d1f7a"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ed36a"/>
      <stop offset="1" stop-color="#3f8f3f"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="192" height="192" rx="24" fill="#fdf6ff"/>
  <circle cx="100" cy="106" r="78" fill="#f2e4fb"/>

  <!-- ombra -->
  <ellipse cx="100" cy="166" rx="52" ry="10" fill="#3d1a5c" opacity="0.12"/>

  <!-- frutto -->
  <path d="M100 54 C 132 54 160 82 160 118 C 160 150 134 170 100 170 C 66 170 40 150 40 118 C 40 82 68 54 100 54 Z"
        fill="url(#plum)" stroke="#3d1a5c" stroke-width="3"/>
  <!-- solco -->
  <path d="M100 58 C 92 92 92 136 102 168" stroke="#3d1a5c" stroke-width="4" fill="none" opacity="0.55" stroke-linecap="round"/>
  <!-- riflesso -->
  <ellipse cx="74" cy="92" rx="16" ry="26" fill="#ffffff" opacity="0.28" transform="rotate(-20 74 92)"/>
  <circle cx="66" cy="84" r="6" fill="#ffffff" opacity="0.5"/>

  <!-- picciolo -->
  <path d="M100 56 Q 102 40 112 30" stroke="#6b4a2a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- foglia -->
  <path d="M112 34 C 128 14 156 18 164 34 C 148 52 122 52 112 34 Z" fill="url(#leaf)" stroke="#2f6f2f" stroke-width="2.5"/>
  <path d="M116 34 Q 138 34 158 32" stroke="#2f6f2f" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M132 34 L126 22" stroke="#2f6f2f" stroke-width="2" opacity="0.6"/>
  <path d="M140 33 L146 20" stroke="#2f6f2f" stroke-width="2" opacity="0.6"/>

  <!-- puntini -->
  <g fill="#ffffff" opacity="0.25">
    <circle cx="120" cy="132" r="3"/><circle cx="132" cy="112" r="2.5"/>
    <circle cx="84" cy="138" r="2.5"/>
  </g>
</svg>
