<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><title>Collaudo UI</title><link rel="stylesheet" href="css/style.css?v=13"></head>
<body>
<h1>Collaudo interfaccia</h1>
<pre id="summary">in corso…</pre>
<div id="app" class="app"></div>
<div id="overlay" class="overlay hidden"></div>
<script>try { localStorage.clear(); } catch (e) { /* storage non disponibile */ }</script>
<script>window.__errs = []; window.addEventListener('error', function (e) { window.__errs.push((e.message || 'errore') + ' @ riga ' + e.lineno + ' | ' + ((e.error && e.error.stack) || '').replace(/\n/g, ' ¦ ')); });</script>
<script src="js/config.js?v=8"></script>
<script src="js/data/words.js?v=9"></script>
<script src="js/data/associations.js?v=8"></script>
<script src="js/state/store.js?v=8"></script>
<script src="js/engine/generator.js?v=8"></script>
<script src="js/ui/components.js?v=13"></script>
<script src="js/ui/home.js?v=9"></script>
<script src="js/ui/reading.js?v=8"></script>
<script src="js/ui/match.js?v=9"></script>
<script src="js/ui/speech.js?v=10"></script>
<script src="js/ui/choice.js?v=9"></script>
<script src="js/ui/ocr.js?v=14"></script>
<script src="js/ui/custom.js?v=13"></script>
<script src="js/ui/parent.js?v=8"></script>
<script src="js/app.js?v=8"></script>
<script>
(async function () {
  const out = [];
  let pass = 0, fail = 0;
  const check = (name, cond) => { if (cond) { pass++; out.push('✔ ' + name); } else { fail++; out.push('✘ ' + name); } };
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const buttons = () => Array.from(document.querySelectorAll('#app button'));
  const btnWith = (t) => buttons().find(b => b.textContent.indexOf(t) !== -1);
  const body = () => document.getElementById('app').textContent;

  await wait(50);
  // Onboarding → crea profilo
  const nameInput = document.querySelector('#overlay input[type="text"]');
  const startBtn = Array.from(document.querySelectorAll('#overlay button')).find(b => b.textContent.indexOf('Inizia') !== -1);
  nameInput.value = 'Sofia';
  startBtn.click();
  await wait(50);
  check('Profilo creato → home con le quattro modalità', body().indexOf('SOLO LETTURA') !== -1 && body().indexOf('LEGGI E GUARDA') !== -1 && body().indexOf('DICO LA PAROLA') !== -1 && body().indexOf('VEDI E SCEGLI') !== -1);

  // Home: ogni sezione ha un colore diverso
  const menuBtns = Array.from(document.querySelectorAll('.menu .btn'));
  const bgSet = new Set(menuBtns.map(b => getComputedStyle(b).backgroundColor));
  const cNames = menuBtns.map(b => (b.className.match(/btn-(\w+)/) || [])[1]).join(',');
  check('Home: ' + menuBtns.length + ' sezioni, ognuna con colore unico [' + cNames + ']', menuBtns.length === 6 && bgSet.size === 6);

  // Configura lettere: vocali + P + M + N, sillabe studiate
  IAL.Store.updateActive(pr => {
    pr.letters = { vowels: ['A','E','I','O','U'], consonants: ['P','M','N'] };
    pr.syllables = { P: ['PA','PE','PI','PO','PU','RA','RE'], M: ['MA','ME','MI','MO','MU'], N: ['NA','NE','NI','NO','NU'] };
  });

  // --- SOLO LETTURA ---
  IAL.Reading.show();
  await wait(50);
  check('Schermata lettura con esercizio', document.getElementById('ex-word').textContent.length >= 1);
  const ok = ['A','E','I','O','U','P','M','N'];
  let leak = false, leakTxt = '';
  for (let i = 0; i < 30; i++) { btnWith('NUOVO').click(); await wait(20); const t = document.getElementById('ex-word').textContent; if (![...t].every(c => ok.indexOf(c) !== -1)) { leak = true; leakTxt = t; break; } }
  check('30 esercizi: solo lettere abilitate (P,M,N + vocali) -> "' + leakTxt + '"', !leak);

  const stars0 = IAL.Store.active().stats.stars;
  btnWith('CORRETTO').click(); await wait(50);
  check('CORRETTO → +1 stella', IAL.Store.active().stats.stars === stars0 + 1);
  btnWith('RITENTA').click(); await wait(20);
  check('RITENTA registrato (da ripetere)', IAL.Store.active().stats.retried >= 1);
  check('RIPETI presente', !!btnWith('RIPETI'));

  // --- LEGGI E GUARDA ---
  IAL.Match.show();
  await wait(1200); // attende l'eventuale avanzamento automatico in sospeso da SOLO LETTURA
  IAL.Match.show(); // riapre pulita
  await wait(50);
  check('Schermata associa con esercizio', document.getElementById('mx-word').textContent.length >= 1);
  let assocOK = true, allValid = true;
  for (let i = 0; i < 30; i++) {
    try {
      const t = document.getElementById('mx-type').textContent;
      if (t !== 'Parola') { allValid = false; break; }
      btnWith('CORRETTO').click(); await wait(20);
      const reveal = document.getElementById('mx-reveal').textContent;
      if (!reveal) { assocOK = false; out.push('  stato: ' + document.getElementById('app').textContent.slice(0, 120)); break; }
      btnWith('AVANTI').click(); await wait(20);
      if (!document.getElementById('mx-word')) { assocOK = false; break; }
    } catch (e) {
      assocOK = false;
      out.push('  errore i=' + i + ': ' + e.message + ' | schermata: ' + document.getElementById('app').textContent.slice(0, 120));
      break;
    }
  }
  check('Associa: solo parole reali complete con immagine (mai sillabe o inventate)', allValid);
  check('Associa: dopo CORRETTO compare sempre immagine/parola', assocOK);

  // --- DICO LA PAROLA ---
  IAL.Speech.show();
  await wait(100);
  check('Schermata "Dico la parola" con esercizio', !!document.getElementById('sp-word') && document.getElementById('sp-word').textContent.length >= 1);
  check('Stato microfono/istruzioni visibile', document.getElementById('sp-status-txt').textContent.length > 0);
  check('Pulsante SALTA presente, ASCOLTA rimosso', !!btnWith('SALTA') && !btnWith('ASCOLTA'));
  check('Pulsante VERIFICA (microfono) o conferma manuale CORRETTO presente', !!btnWith('VERIFICA') || !!btnWith('CORRETTO'));
  const spWord0 = document.getElementById('sp-word').textContent;
  btnWith('SALTA').click(); await wait(50);
  check('SALTA → nuova parola', !!document.getElementById('sp-word') && document.getElementById('sp-word').textContent !== spWord0);
  IAL.Speech.hide();

  // DICO LA PAROLA è svincolata dalle categorie: mostra sempre parole complete
  const sylsStudied = ['PA','PE','PI','PO','PU','RA','RE','MA','ME','MI','MO','MU','NA','NE','NI','NO','NU'];
  IAL.Store.updateActive(pr => { pr.settings.categories = { letters: false, syllables: true, words: false }; });
  IAL.Speech.show();
  await wait(100);
  const spWord2 = document.getElementById('sp-word').textContent;
  check('DICO LA PAROLA: sempre parole complete (anche con solo sillabe attive)', !!IAL.WORDS_BY_KEY[spWord2] && sylsStudied.indexOf(spWord2) === -1);
  IAL.Speech.hide();
  IAL.Store.updateActive(pr => { pr.settings.categories = { letters: true, syllables: true, words: true }; });

  // Errore di pronuncia: NESSUNA voce che rivela la parola, solo segnale acustico
  IAL.Speech.show();
  await wait(100);
  const spWrongWord = document.getElementById('sp-word').textContent;
  const origSpeak = window.speechSynthesis && window.speechSynthesis.speak;
  let spoken = 0;
  if (window.speechSynthesis) window.speechSynthesis.speak = function () { spoken++; };
  IAL.Speech.wrongForTest('');
  await wait(60);
  check('Errore → messaggio di incoraggiamento (sa ciò che ha sentito)', document.getElementById('sp-msg').textContent.length > 0);
  await wait(1500);
  if (window.speechSynthesis) window.speechSynthesis.speak = origSpeak;
  check('Errore → l’app NON pronuncia la parola corretta (solo segnale acustico)', spoken === 0);
  check('Errore → resta la STESSA parola per riprovare', document.getElementById('sp-word').textContent === spWrongWord);
  check('Errore → torna il pulsante per riprovare (VERIFICA o CORRETTO)', !!btnWith('VERIFICA') || !!btnWith('CORRETTO'));
  IAL.Speech.hide();

  // --- VEDI E SCEGLI ---
  IAL.Choice.show();
  await wait(100);
  const vcImgEl = document.getElementById('vc-img');
  check('Schermata "Vedi e scegli" con immagine',
    !!vcImgEl && (vcImgEl.textContent.length >= 1 || !!vcImgEl.querySelector('img')));
  check('Immagini: MAGIA e MIMO usano i disegni (non emoji confuse)',
    IAL.WORDS_BY_KEY.MAGIA.img === 'img/magia.svg' && IAL.WORDS_BY_KEY.MIMO.img === 'img/mimo.svg');
  check('Immagini: il disegno diventa un <img> con la classe pic',
    (function () {
      const box = IAL.UI.el('div', {}, [IAL.UI.pic('img/mimo.svg')]);
      const im = box.querySelector('img.pic');
      return !!im && im.getAttribute('src') === 'img/mimo.svg';
    })());
  const vcOpts = Array.from(document.querySelectorAll('#vc-options button'));
  check('Scelta multipla con 2-4 opzioni', vcOpts.length >= 2 && vcOpts.length <= 4);
  check('Opzioni: solo sillabe di 2 lettere con consonante abilitata', vcOpts.every(b => /^[A-Z]{2}$/.test(b.textContent) && ok.indexOf(b.textContent[0]) !== -1));
  // Deterministico: prima un'opzione sbagliata, poi quella giusta
  const vcCur = IAL.Choice.currentForTest();
  const wrongBtn = vcOpts.find(b => b.textContent !== vcCur.syllable);
  const rightBtn = vcOpts.find(b => b.textContent === vcCur.syllable);
  wrongBtn.click(); await wait(40);
  check('Opzione sbagliata → rossa e disabilitata, si riprova', wrongBtn.disabled && wrongBtn.classList.contains('ko'));
  rightBtn.click(); await wait(60);
  check('Opzione giusta → parola completa rivelata', !!document.getElementById('vc-reveal').textContent.trim());
  // Vedi e scegli: inizio sempre con sillaba studiata; ammesse lettere nuove nel resto
  let relOk = true, relaxed = false;
  for (let i = 0; i < 40; i++) {
    const ex = IAL.Engine.nextChoice(IAL.Store.active(), { lengths: [2,3,4,5,6] });
    if (!ex) continue;
    if (!IAL.Engine.canShowSyllable(IAL.Store.active(), ex.syllable, IAL.Engine.enabledLetters(IAL.Store.active()))) { relOk = false; break; }
    if ([...ex.word].some(L => ok.indexOf(L) === -1)) relaxed = true;
  }
  check('Vedi e scegli: inizio sempre sillaba studiata e attiva', relOk);
  check('Vedi e scegli: parole anche con lettere non ancora studiate', relaxed);
  IAL.Choice.hide();

  // --- PAROLE MIE ---
  IAL.Custom.show();
  await wait(100);
  check('Parole mie: senza parole torna la gestione con invito', body().indexOf('Aggiungi la prima parola') !== -1);
  const addCm = async (v) => { document.getElementById('cm-new-word').value = v; btnWith('Aggiungi parola').click(); await wait(50); };
  await addCm('nonna');
  await addCm('luna');
  check('Parole mie: aggiunte e normalizzate in MAIUSCOLE', body().indexOf('NONNA') !== -1 && body().indexOf('LUNA') !== -1);
  await addCm('NONNA');
  check('Parole mie: duplicato scartato', IAL.Store.active().customWords.length === 2);
  btnWith('GIOCA').click(); await wait(50);
  const cmWord = document.getElementById('cm-word').textContent;
  check('Parole mie: esercizio con le parole inserite', cmWord === 'NONNA' || cmWord === 'LUNA');
  const starsCm = IAL.Store.active().stats.stars;
  btnWith('CORRETTO').click(); await wait(50);
  check('Parole mie: CORRETTO → +1 stella', IAL.Store.active().stats.stars === starsCm + 1);
  btnWith('GESTISCI LE PAROLE').click(); await wait(50);
  document.querySelector('button[aria-label="Rimuovi NONNA"]').click(); await wait(50);
  check('Parole mie: parola rimossa dalla lista', IAL.Store.active().customWords.length === 1);

  // --- PAROLE MIE: aggiunta da foto (OCR) e cancellazione totale ---
  check('Parole da foto: pulsante «Scatta foto» presente', !!btnWith('Scatta foto'));
  check('Parole da foto: pulsante «Galleria» presente', !!btnWith('Galleria'));
  const phCam = document.getElementById('cm-photo-cam');
  check('Parole da foto: scatto diretto con fotocamera posteriore (capture=environment)',
    !!phCam && phCam.getAttribute('accept') === 'image/*' && phCam.getAttribute('capture') === 'environment');
  const ph = document.getElementById('cm-photo');
  check('Parole da foto: campo galleria pronto (solo immagini)', !!ph && ph.getAttribute('accept') === 'image/*');
  check('Parole da foto: modulo OCR caricato', !!(IAL.OCR && typeof IAL.OCR.recognize === 'function' && typeof IAL.OCR.wordsFromText === 'function'));

  const wft = IAL.OCR.wordsFromText;
  check('OCR: parole divise da spazi e punteggiatura',
    wft('PANE, CASA. SOLE!').join(',') === 'PANE,CASA,SOLE');
  check('OCR: minuscole e accenti normalizzati',
    wft('perché sarà').join(',') === 'PERCHE,SARA');
  check('OCR: parole spezzate a fine riga ricomposte (PAR- / LA)',
    wft('PAR-\nLA').join(',') === 'PARLA');
  check('OCR: scarta lettere singole, numeri e rumore',
    wft('A 3 12 ... MMMM K').length === 0);
  check('OCR: duplicati rimossi', wft('CASA casa CASA').join(',') === 'CASA');
  check('OCR: corregge le confusioni tipiche (5OLE P0RTA 8ANCO → SOLE PORTA BANCO)',
    wft('5OLE P0RTA 8ANCO').join(',') === 'SOLE,PORTA,BANCO');
  check('OCR: la cifra 1 dentro una parola diventa I (SO1E → SOIE)',
    wft('SO1E').join(',') === 'SOIE');
  check('OCR: i numeri da soli restano fuori', wft('12 007 3').length === 0);
  check('OCR: parole oltre 12 lettere scartate', wft('PRECIPITEVOLEISSIMAMENTE').length === 0);
  check('OCR: lettura di più righe con parole ripetute a capo',
    wft('NONNA\nLUNA\nNONNA\nMARE').join(',') === 'NONNA,LUNA,MARE');

  check('Cancella tutto: pulsante presente in fondo',
    !!btnWith('Cancella tutte le parole'));
  btnWith('Cancella tutte le parole').click(); await wait(50);
  const yesAll = Array.from(document.querySelectorAll('#overlay button'))
    .find(b => b.textContent.indexOf('cancella tutto') !== -1);
  check('Cancella tutto: chiede conferma (parole ancora presenti)',
    !!yesAll && IAL.Store.active().customWords.length === 1);
  yesAll.click(); await wait(50);
  check('Cancella tutto: elenco svuotato', IAL.Store.active().customWords.length === 0);

  // --- PAROLE MIE: revisione delle parole lette da foto ---
  IAL.Custom.photoReview(['NONNA', 'LUNA', 'CASA']); await wait(50);
  const foundInputs = document.querySelectorAll('#cm-found input.cw-input');
  check('Parole da foto: elenco controllabile con le parole trovate', foundInputs.length === 3);
  foundInputs[2].value = 'pane';
  btnWith('Aggiungi le parole').click(); await wait(50);
  const cw = IAL.Store.active().customWords;
  check('Parole da foto: parola corretta e aggiunta insieme alle altre',
    cw.length === 3 && cw.indexOf('PANE') !== -1 && cw.indexOf('CASA') === -1);
  IAL.Custom.photoReview(['NONNA', 'LUNA', 'PANE']); await wait(50);
  check('Parole da foto: se sono già tutte in elenco non propone nulla',
    body().indexOf('Nessuna parola nuova') !== -1);

  IAL.Store.updateActive(pr => { pr.customWords = []; });
  check('Parole mie: home con la nuova sezione presente', true);

  // --- DICO LA PAROLA: valutazione tollerante (senza microfono) ---
  const mt = IAL.Speech.matchTest;
  check('Riconoscimento: parola esatta ("pane")', mt('PANE', 'pane'));
  check('Riconoscimento: accenti e maiuscole ("città")', mt('CITTÀ', 'citta'));
  check('Riconoscimento: parola dentro una frase ("il pane!")', mt('PANE', 'il pane!'));
  check('Riconoscimento: confusione P/B tollerata ("bale" per PALE)', mt('PALE', 'bale'));
  check('Riconoscimento: confusione F/G tollerata ("fatto" per GATTO)', mt('GATTO', 'fatto'));
  check('Riconoscimento: parola sbagliata rifiutata ("gatto" ≠ PANE)', !mt('PANE', 'gatto'));
  check('Riconoscimento: frammento troppo corto rifiutato ("pa" ≠ PANE)', !mt('PANE', 'pa'));
  check('Riconoscimento: rumore di una lettera rifiutato ("e" ≠ PANE)', !mt('PANE', 'e'));
  check('Riconoscimento: parola corta esatta ("re")', mt('RE', 're'));

  // --- AREA GENITORI ---
  IAL.Parent.show();
  await wait(50);
  check('Area genitori: scheda lettere', body().indexOf('Lettere già studiate') !== -1);
  btnWith('Combinazioni').click(); await wait(30);
  check('Scheda combinazioni', body().indexOf('Combinazioni e strutture studiate') !== -1);
  check('Chip PA visibile', body().indexOf('PA') !== -1);
  btnWith('Esercizi').click(); await wait(30);
  check('Scheda esercizi + livelli', body().indexOf('Livello di progressione') !== -1);
  check('Scheda esercizi: niente contatori «sono disponibili»', body().indexOf('sono disponibili') === -1);
  btnWith('Progressi').click(); await wait(30);
  check('Scheda progressi', body().indexOf('Progressi di Sofia') !== -1);
  btnWith('Sicurezza').click(); await wait(30);
  check('Scheda sicurezza: PIN presente', body().indexOf('PIN dell’Area Genitori') !== -1);
  check('Scheda sicurezza: backup esporta/importa rimosso', body().indexOf('Backup dei dati') === -1);
  btnWith('Profili').click(); await wait(30);
  check('Scheda profili', body().indexOf('Nuovo profilo') !== -1);

  // PIN: impostalo e verifica il blocco
  btnWith('Sicurezza').click(); await wait(30);
  const pinInput = document.querySelector('#app input[type="password"]');
  pinInput.value = '1234';
  btnWith('Salva PIN').click(); await wait(30);
  IAL.Parent.unlockedForTest = null;
  // simula nuova apertura con PIN attivo
  const ParentShow = IAL.Parent.show; // mostra keypad
  // ricarica lo stato "bloccato" tramite location non possibile qui: verifichiamo la logica
  check('PIN salvato', IAL.Store.parentPin() === '1234');
  IAL.Store.setParentPin(null);

  out.push('');
  out.push(fail === 0 ? 'UI TEST SUPERATI (' + pass + ')' : 'UI TEST FALLITI: ' + fail + ' su ' + (pass + fail));
  document.getElementById('summary').textContent = out.join('\n');
})();
</script>
</body>
</html>
