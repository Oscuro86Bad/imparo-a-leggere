<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><title>Collaudo UI</title><link rel="stylesheet" href="css/style.css?v=25"></head>
<body>
<h1>Collaudo interfaccia</h1>
<pre id="summary">in corso…</pre>
<div id="app" class="app"></div>
<div id="overlay" class="overlay hidden"></div>
<script>try { localStorage.clear(); } catch (e) { /* storage non disponibile */ }</script>
<script>window.__errs = []; window.addEventListener('error', function (e) { window.__errs.push((e.message || 'errore') + ' @ riga ' + e.lineno + ' | ' + ((e.error && e.error.stack) || '').replace(/\n/g, ' ¦ ')); }); window.addEventListener('unhandledrejection', function (e) { window.__errs.push('PROMISE: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)); });</script>
<script src="js/config.js?v=11"></script>
<script src="js/data/words.js?v=24"></script>
<script src="js/data/sentences.js?v=5"></script>
<script src="js/data/associations.js?v=9"></script>
<script src="js/state/store.js?v=8"></script>
<script src="js/engine/generator.js?v=18"></script>
<script src="js/ui/components.js?v=19"></script>
<script src="js/ui/home.js?v=19"></script>
<script src="js/ui/blend.js?v=3"></script>
<script src="js/ui/reading.js?v=12"></script>
<script src="js/ui/match.js?v=12"></script>
<script src="js/ui/speech.js?v=12"></script>
<script src="js/ui/choice.js?v=13"></script>
<script src="js/ui/listen.js?v=3"></script>
<script src="js/ui/complete.js?v=6"></script>
<script src="js/ui/link.js?v=1"></script>
<script src="js/ui/sentences.js?v=5"></script>
<script src="js/ui/ocr.js?v=14"></script>
<script src="js/ui/custom.js?v=16"></script>
<script src="js/ui/parent.js?v=9"></script>
<script src="js/app.js?v=8"></script>
<script>
(async function () {
  const out = [];
  let pass = 0, fail = 0;
  const check = (name, cond) => { if (cond) { pass++; out.push('✔ ' + name); } else { fail++; out.push('✘ ' + name); } };
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const buttons = () => Array.from(document.querySelectorAll('#app button'));
  const btnWith = (t) => buttons().find(b => b.textContent.indexOf(t) !== -1);
  const body = () => document.getElementById('app').textContent;

  await wait(50);
  // Onboarding → crea profilo
  const nameInput = document.querySelector('#overlay input[type="text"]');
  const startBtn = Array.from(document.querySelectorAll('#overlay button')).find(b => b.textContent.indexOf('Inizia') !== -1);
  nameInput.value = 'Sofia';
  startBtn.click();
  await wait(50);
  check('Profilo creato → home con le quattro modalità', body().indexOf('SOLO LETTURA') !== -1 && body().indexOf('LEGGI E GUARDA') !== -1 && body().indexOf('DICO LA PAROLA') !== -1 && body().indexOf('VEDI E SCEGLI') !== -1);

  // Home: ogni sezione ha un colore diverso
  const menuBtns = Array.from(document.querySelectorAll('.menu .btn'));
  const bgSet = new Set(menuBtns.map(b => getComputedStyle(b).backgroundColor));
  const cNames = menuBtns.map(b => (b.className.match(/btn-(\w+)/) || [])[1]).join(',');
  check('Home: ' + menuBtns.length + ' sezioni, ognuna con colore unico [' + cNames + ']', menuBtns.length === 11 && bgSet.size === 11);

  // Home: UNISCI LE SILLABE subito dopo SOLO LETTURA, poi PAROLE PERSONALIZZATE
  const homeOrder = Array.from(document.querySelectorAll('.menu .btn .txt')).map(t => (t.firstChild.textContent || '').trim());
  const iReading = homeOrder.indexOf('SOLO LETTURA');
  const iBlend = homeOrder.indexOf('UNISCI LE SILLABE');
  const iCustom = homeOrder.indexOf('PAROLE PERSONALIZZATE');
  const iListen = homeOrder.indexOf('ASCOLTA E SELEZIONA');
  const iComplete = homeOrder.indexOf('COMPLETA LA PAROLA');
  const iLink = homeOrder.indexOf('COLLEGA L’IMMAGINE');
  const iSent = homeOrder.indexOf('LEGGI LA FRASE');
  check('Home: ordine [' + homeOrder.join(' → ') + ']',
    iReading !== -1 && iBlend !== -1 && iCustom !== -1 && iListen !== -1 &&
    iComplete !== -1 && iLink !== -1 && iSent !== -1 &&
    iReading < iBlend && iBlend < iCustom && iCustom < iListen &&
    iListen < iComplete && iComplete < iLink && iLink < iSent);

  // Home: fumetto "NEW" solo sulle sezioni appena aggiunte
  const tagged = Array.from(document.querySelectorAll('.menu .btn')).filter(b => b.querySelector('.new-tag'));
  const taggedNames = tagged.map(b => (b.querySelector('.txt').firstChild.textContent || '').trim());
  check('Home: fumetto NEW solo sulle sezioni nuove [' + taggedNames.join(', ') + ']',
    tagged.length === 5 && taggedNames.indexOf('UNISCI LE SILLABE') !== -1 &&
    taggedNames.indexOf('ASCOLTA E SELEZIONA') !== -1 &&
    taggedNames.indexOf('COMPLETA LA PAROLA') !== -1 &&
    taggedNames.indexOf('COLLEGA L’IMMAGINE') !== -1 &&
    taggedNames.indexOf('LEGGI LA FRASE') !== -1);

  // Home: tutte le sezioni della stessa altezza (niente sezioni "giganti")
  const appEl = document.querySelector('.app');
  const prevMax = appEl.style.maxWidth;
  appEl.style.maxWidth = '720px';
  await wait(40);
  const homeHeights = Array.from(document.querySelectorAll('.menu .btn')).map(b => b.getBoundingClientRect().height);
  appEl.style.maxWidth = prevMax;
  check('Home: sezioni tutte della stessa altezza [' + homeHeights.map(h => Math.round(h)).join(',') + ']',
    Math.max.apply(null, homeHeights) - Math.min.apply(null, homeHeights) <= 2);

  // Home: nomi aggiornati e niente punteggio in alto
  check('Home: la sezione si chiama PAROLE PERSONALIZZATE',
    body().indexOf('PAROLE PERSONALIZZATE') !== -1 && body().indexOf('PAROLE MIE') === -1);
  check('Home: nuova sezione UNISCI LE SILLABE con colore dedicato (lime)',
    body().indexOf('UNISCI LE SILLABE') !== -1 &&
    !!Array.from(document.querySelectorAll('.menu .btn')).find(b => b.classList.contains('btn-lime')));
  check('ASCOLTA LENTO: sezione nascosta nel menu per il momento',
    body().indexOf('ASCOLTA LENTO') === -1 &&
    !Array.from(document.querySelectorAll('.menu .btn')).some(b => b.classList.contains('btn-coral')));
  check('Home: nuova sezione ASCOLTA E SELEZIONA',
    body().indexOf('ASCOLTA E SELEZIONA') !== -1);
  check('Home: nuova sezione COMPLETA LA PAROLA',
    body().indexOf('COMPLETA LA PAROLA') !== -1);
  check('Home: nuova sezione COLLEGA L’IMMAGINE',
    body().indexOf('COLLEGA L’IMMAGINE') !== -1);
  const homeChips = Array.from(document.querySelectorAll('.topbar .chip')).map(c => c.textContent);
  check('Home: nessun punteggio stelline in alto [' + homeChips.join(' | ') + ']',
    homeChips.length === 1 && !homeChips.some(t => t.indexOf('⭐') !== -1));

  // Configura lettere: vocali + P + M + N, sillabe studiate
  IAL.Store.updateActive(pr => {
    pr.letters = { vowels: ['A','E','I','O','U'], consonants: ['P','M','N'] };
    pr.syllables = { P: ['PA','PE','PI','PO','PU','RA','RE'], M: ['MA','ME','MI','MO','MU'], N: ['NA','NE','NI','NO','NU'] };
  });

  // --- UNISCI LE SILLABE ---
  IAL.Blend.show();
  await wait(60);
  let blendEx = IAL.Blend.currentForTest();
  let blendTiles = Array.from(document.querySelectorAll('#blend-stage .syl-tile'));
  // Per il test dell'ordine sbagliato serve una parola con sillabe distinte.
  let guardBlend = 0;
  while (blendEx && blendEx.syllables.every(s => s === blendEx.syllables[0]) && guardBlend++ < 12) {
    btnWith('NUOVA').click();
    await wait(20);
    blendEx = IAL.Blend.currentForTest();
    blendTiles = Array.from(document.querySelectorAll('#blend-stage .syl-tile'));
  }
  const blendDisplay = IAL.Blend.displayForTest();
  check('UNISCI LE SILLABE: riquadri = sillabe della parola, ma mescolate (' +
    blendDisplay.join('+') + ' → ' + (blendEx ? blendEx.word : 'nessuna') + ')',
    !!blendEx && blendTiles.length === blendEx.syllables.length && blendTiles.length >= 2 &&
    blendDisplay.slice().sort().join('|') === blendEx.syllables.slice().sort().join('|') &&
    (blendDisplay.join('|') !== blendEx.syllables.join('|') ||
      blendEx.syllables.every(s => s === blendEx.syllables[0])));
  check('UNISCI LE SILLABE: la mescolatura non lascia mai l’ordine corretto',
    IAL.Blend.shuffleForTest(['MA', 'MMA', 'PA']).join('|') !== 'MA|MMA|PA' &&
    IAL.Blend.shuffleForTest(['ME', 'LA']).join('|') !== 'ME|LA');
  check('UNISCI LE SILLABE: solo parole reali con lettere e sillabe studiate',
    !!blendEx && !blendEx.invented && !!IAL.WORDS_BY_KEY[blendEx.word] &&
    blendEx.syllables.every(s => IAL.Engine.canShowSyllable(
      IAL.Store.active(), s, IAL.Engine.enabledLetters(IAL.Store.active()))));
  const starsBlend0 = IAL.Store.active().stats.stars;
  const wrongTile = blendTiles.find(t => t.textContent !== blendEx.syllables[0]);
  if (wrongTile) wrongTile.click();
  await wait(20);
  check('UNISCI LE SILLABE: ordine sbagliato → nessuna stella e suggerimento gentile',
    !!wrongTile && IAL.Store.active().stats.stars === starsBlend0 &&
    document.getElementById('blend-hint').textContent.indexOf('Prima ') === 0 &&
    !IAL.Blend.stateForTest().solved);
  const origSpeakBlend = window.speechSynthesis && window.speechSynthesis.speak;
  const spokenBlend = [];
  if (window.speechSynthesis) window.speechSynthesis.speak = function (u) {
    const t = String((u && u.text) || '').trim();
    if (t) spokenBlend.push(t.toUpperCase());
  };
  const sentiWordBtn = btnWith('SENTI LA PAROLA');
  check('UNISCI LE SILLABE: tasto SENTI LA PAROLA presente', !!sentiWordBtn);
  if (sentiWordBtn && window.speechSynthesis) {
    spokenBlend.length = 0;
    sentiWordBtn.click();
    await wait(30);
    check('UNISCI LE SILLABE: SENTI ripete tutta la parola, non una sola sillaba',
      spokenBlend.indexOf(blendEx.word) !== -1 &&
      !spokenBlend.some(t => t !== blendEx.word && blendEx.syllables.indexOf(t) !== -1));
  }
  // Tocchiamo il riquadro con il testo giusto, non quello in prima posizione.
  blendEx.syllables.forEach(function (syl) {
    const tile = Array.from(document.querySelectorAll('#blend-stage .syl-tile')).find(
      t => !t.classList.contains('chosen') && t.textContent === syl
    );
    if (tile) tile.click();
  });
  await wait(60);
  if (window.speechSynthesis) window.speechSynthesis.speak = origSpeakBlend;
  check('UNISCI LE SILLABE: unendo i riquadri si ottiene la parola',
    IAL.Blend.stateForTest().solved && IAL.Blend.stateForTest().chosen.join('') === blendEx.word &&
    document.getElementById('blend-result').textContent === blendEx.word &&
    document.getElementById('blend-result').classList.contains('done'));
  check('UNISCI LE SILLABE: +1 stella e parola pronunciata',
    IAL.Store.active().stats.stars === starsBlend0 + 1 &&
    (!window.speechSynthesis || spokenBlend.indexOf(blendEx.word) !== -1));
  IAL.Blend.hide();

  // --- SOLO LETTURA ---
  IAL.Reading.show();
  await wait(50);
  check('Schermata lettura con esercizio', document.getElementById('ex-word').textContent.length >= 1);
  const ok = ['A','E','I','O','U','P','M','N'];
  let leak = false, leakTxt = '';
  for (let i = 0; i < 30; i++) { btnWith('NUOVO').click(); await wait(20); const t = document.getElementById('ex-word').textContent; if (![...t].every(c => ok.indexOf(c) !== -1)) { leak = true; leakTxt = t; break; } }
  check('30 esercizi: solo lettere abilitate (P,M,N + vocali) -> "' + leakTxt + '"', !leak);

  const stars0 = IAL.Store.active().stats.stars;
  const readWord0 = document.getElementById('ex-word').textContent;
  const origSpeakRead = window.speechSynthesis && window.speechSynthesis.speak;
  const spokenRead = [];
  if (window.speechSynthesis) window.speechSynthesis.speak = function (u) { const t = String((u && u.text) || '').trim(); if (t) spokenRead.push(t.toUpperCase()); };
  btnWith('CORRETTO').click(); await wait(400);
  check('CORRETTO → +1 stella', IAL.Store.active().stats.stars === stars0 + 1);
  check('CORRETTO → pronuncia la parola corretta (' + readWord0 + ')',
    !window.speechSynthesis || (spokenRead.length >= 1 && spokenRead[0] === readWord0));
  if (window.speechSynthesis) window.speechSynthesis.speak = origSpeakRead;
  check('SOLO LETTURA: niente RIPETI e RITENTA (non servono)',
    !btnWith('RIPETI') && !btnWith('RITENTA'));
  check('Pulsante 🔊 SENTI presente in SOLO LETTURA', !!btnWith('SENTI'));

  // --- LEGGI E GUARDA ---
  IAL.Match.show();
  await wait(1200); // attende l'eventuale avanzamento automatico in sospeso da SOLO LETTURA
  IAL.Match.show(); // riapre pulita
  await wait(50);
  check('Schermata associa con esercizio', document.getElementById('mx-word').textContent.length >= 1);
  const mxWord0 = document.getElementById('mx-word').textContent;
  const origSpeakMx = window.speechSynthesis && window.speechSynthesis.speak;
  const spokenMx = [];
  if (window.speechSynthesis) window.speechSynthesis.speak = function (u) { const t = String((u && u.text) || '').trim(); if (t) spokenMx.push(t.toUpperCase()); };
  btnWith('CORRETTO').click(); await wait(400);
  check('LEGGI E GUARDA → CORRETTO pronuncia la parola (' + mxWord0 + ')',
    !window.speechSynthesis || (spokenMx.length >= 1 && spokenMx[0] === mxWord0));
  check('Pulsante 🔊 SENTI presente in LEGGI E GUARDA', !!btnWith('SENTI'));
  if (window.speechSynthesis) window.speechSynthesis.speak = origSpeakMx;
  btnWith('AVANTI').click(); await wait(30);
  let assocOK = true, allValid = true;
  for (let i = 0; i < 30; i++) {
    try {
      const t = document.getElementById('mx-type').textContent;
      if (t !== 'Parola') { allValid = false; break; }
      btnWith('CORRETTO').click(); await wait(20);
      const reveal = document.getElementById('mx-reveal').textContent;
      if (!reveal) { assocOK = false; out.push('  stato: ' + document.getElementById('app').textContent.slice(0, 120)); break; }
      btnWith('AVANTI').click(); await wait(20);
      if (!document.getElementById('mx-word')) { assocOK = false; break; }
    } catch (e) {
      assocOK = false;
      out.push('  errore i=' + i + ': ' + e.message + ' | schermata: ' + document.getElementById('app').textContent.slice(0, 120));
      break;
    }
  }
  check('Associa: solo parole reali complete con immagine (mai sillabe o inventate)', allValid);
  check('Associa: dopo CORRETTO compare sempre immagine/parola', assocOK);

  // --- DICO LA PAROLA ---
  IAL.Speech.show();
  await wait(100);
  check('Schermata "Dico la parola" con esercizio', !!document.getElementById('sp-word') && document.getElementById('sp-word').textContent.length >= 1);
  check('Stato microfono/istruzioni visibile', document.getElementById('sp-status-txt').textContent.length > 0);
  check('Pulsante SALTA presente, ASCOLTA rimosso', !!btnWith('SALTA') && !btnWith('ASCOLTA'));
  check('Pulsante VERIFICA (microfono) o conferma manuale CORRETTO presente', !!btnWith('VERIFICA') || !!btnWith('CORRETTO'));
  const spWord0 = document.getElementById('sp-word').textContent;
  btnWith('SALTA').click(); await wait(50);
  check('SALTA → nuova parola', !!document.getElementById('sp-word') && document.getElementById('sp-word').textContent !== spWord0);
  IAL.Speech.hide();

  // DICO LA PAROLA è svincolata dalle categorie: mostra sempre parole complete
  const sylsStudied = ['PA','PE','PI','PO','PU','RA','RE','MA','ME','MI','MO','MU','NA','NE','NI','NO','NU'];
  IAL.Store.updateActive(pr => { pr.settings.categories = { letters: false, syllables: true, words: false }; });
  IAL.Speech.show();
  await wait(100);
  const spWord2 = document.getElementById('sp-word').textContent;
  check('DICO LA PAROLA: sempre parole complete (anche con solo sillabe attive)', !!IAL.WORDS_BY_KEY[spWord2] && sylsStudied.indexOf(spWord2) === -1);
  IAL.Speech.hide();
  IAL.Store.updateActive(pr => { pr.settings.categories = { letters: true, syllables: true, words: true }; });

  // Errore di pronuncia: NESSUNA voce che rivela la parola, solo segnale acustico
  IAL.Speech.show();
  await wait(100);
  const spWrongWord = document.getElementById('sp-word').textContent;
  const origSpeak = window.speechSynthesis && window.speechSynthesis.speak;
  let spoken = 0;
  if (window.speechSynthesis) window.speechSynthesis.speak = function () { spoken++; };
  IAL.Speech.wrongForTest('');
  await wait(60);
  check('Errore → messaggio di incoraggiamento (sa ciò che ha sentito)', document.getElementById('sp-msg').textContent.length > 0);
  await wait(1500);
  if (window.speechSynthesis) window.speechSynthesis.speak = origSpeak;
  check('Errore → l’app NON pronuncia la parola corretta (solo segnale acustico)', spoken === 0);
  check('Errore → resta la STESSA parola per riprovare', document.getElementById('sp-word').textContent === spWrongWord);
  check('Errore → torna il pulsante per riprovare (VERIFICA o CORRETTO)', !!btnWith('VERIFICA') || !!btnWith('CORRETTO'));
  IAL.Speech.hide();

  // --- VEDI E SCEGLI ---
  IAL.Choice.show();
  await wait(100);
  const vcImgEl = document.getElementById('vc-img');
  check('Schermata "Vedi e scegli" con immagine',
    !!vcImgEl && (vcImgEl.textContent.length >= 1 || !!vcImgEl.querySelector('img')));
  check('Vedi e scegli: la domanda è "Con cosa inizia?"',
    (document.getElementById('vc-msg') || {}).textContent === 'Con cosa inizia? 🔍');
  const origSpeakVc = window.speechSynthesis && window.speechSynthesis.speak;
  const spokenVc = [];
  if (window.speechSynthesis) window.speechSynthesis.speak = function (u) { const t = String((u && u.text) || '').trim(); if (t) spokenVc.push(t.toUpperCase()); };
  const vcWordForSay = IAL.Choice.currentForTest().word;
  check('Pulsante 🔊 SENTI presente in VEDI E SCEGLI', !!btnWith('SENTI'));
  btnWith('SENTI').click(); await wait(150);
  check('Vedi e scegli: SENTI pronuncia la parola (' + vcWordForSay + ')',
    spokenVc.indexOf(vcWordForSay) !== -1);
  if (window.speechSynthesis) window.speechSynthesis.speak = origSpeakVc;

  // La voce delle parole usa l'audio preregistrato quando è disponibile
  // (voce neurale chiara anche su iOS); la sintesi del dispositivo resta
  // come fallback per sillabe, parole inventate e parole personalizzate.
  const RealAudio = window.Audio;
  let fakeAudioLast = null, fakeAudioDone = 0;
  function FakeAudio() {
    fakeAudioLast = this;
    this.play = function () { return Promise.resolve(); };
    this.pause = function () {};
    this.load = function () {};
    this.removeAttribute = function () {};
    this.currentTime = 0;
    this.volume = 1;
  }
  window.Audio = FakeAudio;
  const oldAudioMap = IAL.AUDIO_MAP;
  IAL.AUDIO_MAP = { 'TETTOIA': 'audio/w/tettoia.mp3' };
  IAL.UI.say('TETTOIA', function () { fakeAudioDone++; });
  check('Voce parole: usa l’audio preregistrato (TETTOIA)',
    !!fakeAudioLast && fakeAudioLast.src === 'audio/w/tettoia.mp3');
  if (fakeAudioLast && fakeAudioLast.onended) fakeAudioLast.onended();
  check('Voce parole: a fine audio chiama done()', fakeAudioDone === 1);
  IAL.UI.stopSpeech();
  IAL.AUDIO_MAP = oldAudioMap;
  window.Audio = RealAudio;

  check('Immagini: MAGIA e MIMO usano i disegni (non emoji confuse)',
    IAL.WORDS_BY_KEY.MAGIA.img === 'img/magia.svg' && IAL.WORDS_BY_KEY.MIMO.img === 'img/mimo.svg');
  check('Immagini: LAGO, MERENDA e PIRATA usano disegni dedicati',
    IAL.WORDS_BY_KEY.LAGO.img === 'img/lago.svg' &&
    IAL.WORDS_BY_KEY.MERENDA.img === 'img/merenda.svg' &&
    IAL.WORDS_BY_KEY.PIRATA.img === 'img/pirata.svg');
  check('Immagini: TAVOLO (tavolo, non sedia) e TUTA (tuta, non maglietta)',
    IAL.WORDS_BY_KEY.TAVOLO.img === 'img/tavolo.svg' &&
    IAL.WORDS_BY_KEY.TUTA.img === 'img/tuta.svg');
  check('Nuove parole vocali + T / L-P-M-T presenti (TATA, TUTU, TETTO, LETTO…)',
    ['TATA','TUTU','TETTO','TATTO','TUTTO','TAPPO','LETTO','LOTO','LUME','MUTA','MOLO','MOTORE','POMATA']
      .every(function (w) { return !!IAL.WORDS_BY_KEY[w]; }));
  check('Nuove parole reali con immagine per LEGGI E GUARDA e DICO LA PAROLA',
    ['TATA','TUTU','TETTO','TATTO','TAPPO','LETTO','LOTO','LUME','MUTA','MOLO','MOTORE','POMATA']
      .every(function (w) { return !!IAL.WORDS_BY_KEY[w].img; }));
  check('Immagini: TETTO ha il disegno dedicato', IAL.WORDS_BY_KEY.TETTO.img === 'img/tetto.svg');
  check('Immagini: nuovi disegni dedicati (FARO, FISCHIO, NUTRIA, QUOTA, SUSINA, ZUFOLO, ZIP)',
    ['FARO','FISCHIO','NUTRIA','QUOTA','SUSINA','ZUFOLO','ZIP']
      .every(function (w) { return !!IAL.WORDS_BY_KEY[w] && IAL.WORDS_BY_KEY[w].img.indexOf('img/') === 0; }));
  check('Parole inventate curate: TATU (e altre) pronte, mai parole reali',
    (IAL.INVENTED_WORDS || []).length >= 20 &&
    IAL.INVENTED_WORDS.some(function (e) { return e.w === 'TATU'; }) &&
    !IAL.WORDS_BY_KEY['TATU']);
  check('Immagini: il disegno diventa un <img> con la classe pic',
    (function () {
      const box = IAL.UI.el('div', {}, [IAL.UI.pic('img/mimo.svg')]);
      const im = box.querySelector('img.pic');
      return !!im && im.getAttribute('src') === 'img/mimo.svg';
    })());
  const vcOpts = Array.from(document.querySelectorAll('#vc-options button'));
  check('Scelta multipla con 2-4 opzioni', vcOpts.length >= 2 && vcOpts.length <= 4);
  check('Opzioni: solo sillabe di 2 lettere con consonante abilitata', vcOpts.every(b => /^[A-Z]{2}$/.test(b.textContent) && ok.indexOf(b.textContent[0]) !== -1));
  // Deterministico: prima un'opzione sbagliata, poi quella giusta
  const vcCur = IAL.Choice.currentForTest();
  const wrongBtn = vcOpts.find(b => b.textContent !== vcCur.syllable);
  const rightBtn = vcOpts.find(b => b.textContent === vcCur.syllable);
  wrongBtn.click(); await wait(40);
  check('Opzione sbagliata → rossa e disabilitata, si riprova', wrongBtn.disabled && wrongBtn.classList.contains('ko'));
  rightBtn.click(); await wait(60);
  check('Opzione giusta → parola completa rivelata', !!document.getElementById('vc-reveal').textContent.trim());
  // Vedi e scegli: inizio sempre con sillaba studiata; ammesse lettere nuove nel resto
  let relOk = true, relaxed = false;

  // ricarica lo stato "bloccato" tramite location non possibile qui: verifichiamo la logica
  check('PIN salvato', IAL.Store.parentPin() === '1234');
  IAL.Store.setParentPin(null);

  // --- LEGGI LA FRASE ---
  const sentCons = IAL.CONFIG.CONSONANTS.filter(c => c !== 'H');
  const sentSyl = {};
  sentCons.forEach(c => { sentSyl[c] = IAL.cvSyllables(c); });
  IAL.Store.updateActive(pr => {
    pr.letters = { vowels: ['A','E','I','O','U'], consonants: sentCons };
    pr.syllables = sentSyl;
    pr.flags = { doppie:true, gruppi:true, vc:true, sc:true, gn:true, gli:true };
  });
  IAL.Home.show();
  await wait(40);
  check('LEGGI LA FRASE: colore dedicato (oro) nella home',
    !!Array.from(document.querySelectorAll('.menu .btn')).find(b => b.classList.contains('btn-gold')));

  check('ASCOLTA LENTO: nessuna voce nel menu e nessun avvio automatico',
    !Array.from(document.querySelectorAll('.menu .btn')).some(
      b => b.textContent.indexOf('ASCOLTA LENTO') !== -1
    ) && IAL.CONFIG.SHOW_SLOW_LISTEN === false);

  IAL.Sentences.show();
  await wait(80);
  const curSent = IAL.Sentences.currentForTest();
  check('LEGGI LA FRASE: schermata con frase grande in fumetto',
    !!curSent && !!document.getElementById('sentence-text') &&
    document.getElementById('sentence-text').textContent === curSent.t &&
    !!document.querySelector('.comic-bubble') && !!document.querySelector('.comic-card'));
  check('LEGGI LA FRASE: frase di senso compiuto, senza virgole e senza campo immagine',
    !!curSent && !/[,;]/.test(curSent.t) && !('e' in curSent) && !('img' in curSent) &&
    curSent.t.split(/\s+/).length >= 2);
  check('LEGGI LA FRASE: nessuna vignetta, nessuna immagine o emoji di scena',
    !document.querySelector('.comic-scene') && !document.querySelector('.comic-pic') &&
    !document.getElementById('sentence-scene'));
  check('LEGGI LA FRASE: pulsanti NUOVA, HO LETTO e 🔊 SENTI LA FRASE',
    !!btnWith('NUOVA') && !!btnWith('HO LETTO') && !!btnWith('SENTI LA FRASE'));

  const origSpeakSent = window.speechSynthesis && window.speechSynthesis.speak;
  const spokenSent = [];
  if (window.speechSynthesis) window.speechSynthesis.speak = function (u) {
    const t = String((u && u.text) || '').trim();
    if (t) spokenSent.push(t.toLowerCase());
  };
  btnWith('SENTI LA FRASE').click(); await wait(400);
  check('LEGGI LA FRASE: SENTI pronuncia la frase',
    !window.speechSynthesis || spokenSent.indexOf(curSent.t.toLowerCase()) !== -1);
  if (window.speechSynthesis) window.speechSynthesis.speak = origSpeakSent;

  // --- ASCOLTA LENTO: parola/sillaba evidenziata durante la lettura ---
  check('LEGGI LA FRASE: token parola per parola, testo invariato e senza immagini',
    document.querySelectorAll('#sentence-text .word-token').length === curSent.t.split(/\s+/).length &&
    document.getElementById('sentence-text').textContent === curSent.t &&
    !!document.querySelector('#sentence-text .syl-token') &&
    !document.querySelector('#sentence-text img'));
  check('LEGGI LA FRASE: sillabazione MAMMA = MA+MMA',
    IAL.Sentences.syllablesForTest('MAMMA').join('+') === 'MA+MMA' &&
    IAL.Sentences.syllablesForTest('MELONE').join('+') === 'ME+LO+NE');
  check('LEGGI LA FRASE: pulsante 🐢 ASCOLTA LENTO nascosto per il momento',
    !btnWith('ASCOLTA LENTO') && IAL.CONFIG.SHOW_SLOW_LISTEN === false);

  // Il comando è nascosto, ma il codice resta pronto: lo riattiviamo solo
  // nel test per controllare che funzioni ancora se verrà riacceso.
  const slowFlagBefore = IAL.CONFIG.SHOW_SLOW_LISTEN;
  IAL.CONFIG.SHOW_SLOW_LISTEN = true;
  if (window.speechSynthesis) {
    const origSpeakSlow = window.speechSynthesis.speak;
    const ratesSlow = [];
    let lastSlowUtterance = null;
    window.speechSynthesis.speak = function (u) {
      if (!u) return;
      if (typeof u.rate === 'number') ratesSlow.push(u.rate);
      lastSlowUtterance = u;
      if (u.onstart) u.onstart();
      if (u.onboundary) u.onboundary({ charIndex: 0 });
    };
    IAL.Sentences.showSlow();
    await wait(60);
    const curSlow = IAL.Sentences.currentForTest();
    window.speechSynthesis.speak = origSpeakSlow;
    check('ASCOLTA LENTO (riattivato solo nel test): voce più lenta [' + ratesSlow.join(',') + ']',
      ratesSlow.length >= 1 && ratesSlow.every(r => r < 0.85));
    check('ASCOLTA LENTO (riattivato solo nel test): parola e sillaba illuminate',
      IAL.Sentences.highlightedForTest() === 0 &&
      !!document.querySelector('#sentence-text .word-token.active .syl-token.active'));
    if (lastSlowUtterance && lastSlowUtterance.onboundary) {
      const spansSlow = IAL.UI.wordSpans(curSlow.t);
      if (spansSlow[1]) lastSlowUtterance.onboundary({ charIndex: spansSlow[1].start });
    }
    await wait(20);
    check('ASCOLTA LENTO (riattivato solo nel test): evidenziazione segue la parola',
      IAL.Sentences.highlightedForTest() === 1);
    IAL.UI.stopSpeech();
    await wait(10);
    check('ASCOLTA LENTO (riattivato solo nel test): fermando la voce si pulisce',
      IAL.Sentences.highlightedForTest() === -1 &&
      !document.querySelector('#sentence-text .word-token.active'));

    // iOS: niente onboundary → il timer avanza comunque alla prima parola
    const origSpeakFallback = window.speechSynthesis.speak;
    window.speechSynthesis.speak = function (u) { if (u && u.onstart) u.onstart(); };
    IAL.Sentences.showSlow();
    await wait(1200);
    window.speechSynthesis.speak = origSpeakFallback;
    check('ASCOLTA LENTO (riattivato solo nel test): senza onboundary il timer avanza',
      IAL.Sentences.highlightedForTest() === 0);
    IAL.UI.stopSpeech();
  }
  IAL.CONFIG.SHOW_SLOW_LISTEN = slowFlagBefore;
  IAL.Sentences.show();
  await wait(40);

  const starsSent = IAL.Store.active().stats.stars;
  btnWith('HO LETTO').click(); await wait(40);
  check('LEGGI LA FRASE: HO LETTO assegna una stellina',
    IAL.Store.active().stats.stars === starsSent + 1);
  IAL.Sentences.hide();

  // Con poche consonanti: solo lettere attive, vocali comprese.
  IAL.Store.updateActive(pr => { pr.letters = { vowels: ['A','E','I','O','U'], consonants: ['P','M'] }; });
  IAL.Sentences.show();
  await wait(60);
  const allowedFew = ['A','E','I','O','U','P','M'];
  let sentFewOk = true, sentFewDetail = '';
  for (let i = 0; i < 25; i++) {
    const s = IAL.Sentences.currentForTest();
    const lettersOk = !!s && s.t.toUpperCase().split('').every(ch => !/[A-Z]/.test(ch) || allowedFew.indexOf(ch) !== -1);
    if (!s || !lettersOk || s.w > 4 || s.d > 1) {
      sentFewOk = false; sentFewDetail = s ? s.t : 'nessuna frase'; break;
    }
    btnWith('NUOVA').click(); await wait(15);
  }
  check('LEGGI LA FRASE: con P+M solo frasi brevi con lettere attive [' + sentFewDetail + ']', sentFewOk);
  check('LEGGI LA FRASE: nessuna vignetta né campi da compilare',
    !document.querySelector('.comic-scene') && !document.querySelector('.comic-pic') &&
    !document.querySelector('#app input'));

  // Una vocale disattivata blocca la frase anche se le consonanti sono attive.
  const pAllUI = IAL.Store.createProfile('FrasiUIall', '🦉');
  pAllUI.letters = { vowels: ['A','E','I','O','U'], consonants: ['M','L'] };
  const pNoAUI = IAL.Store.createProfile('FrasiUInoA', '🦉');
  pNoAUI.letters = { vowels: ['E','I','O','U'], consonants: ['M','L'] };
  const withAUI = IAL.Engine.sentencePool(pAllUI).find(s => s.t.indexOf('A') !== -1);
  check('LEGGI LA FRASE: vocale A non attivata → frase nascosta (' + (withAUI ? withAUI.t : 'nessuna') + ')',
    !!withAUI && IAL.Engine.canShowSentence(pAllUI, withAUI) && !IAL.Engine.canShowSentence(pNoAUI, withAUI));

  // H è una consonante: serve attivarla per vedere una frase che la contiene.
  const hSentUI = (IAL.SENTENCES || []).find(s => s.c.indexOf('H') !== -1);
  const hConsUI = hSentUI ? hSentUI.c.split('') : [];
  const pHyesUI = IAL.Store.createProfile('FrasiUIhYes', '🦉');
  pHyesUI.letters = { vowels: ['A','E','I','O','U'], consonants: hConsUI };
  const pHnoUI = IAL.Store.createProfile('FrasiUIhNo', '🦉');
  pHnoUI.letters = { vowels: ['A','E','I','O','U'], consonants: hConsUI.filter(c => c !== 'H') };
  check('LEGGI LA FRASE: H consonante, frase mostrata solo se attiva (' + (hSentUI ? hSentUI.t : 'nessuna') + ')',
    !!hSentUI && IAL.CONFIG.VOWELS.indexOf('H') === -1 &&
    IAL.CONFIG.CONSONANTS.indexOf('H') !== -1 &&
    IAL.Engine.canShowSentence(pHyesUI, hSentUI) && !IAL.Engine.canShowSentence(pHnoUI, hSentUI));
  IAL.Sentences.hide();

  // Pronuncia: le parole accentate vengono passate correttamente alla voce.
  IAL.PRONOUNCE_MAP = { PAPA: 'papà', BEBE: 'bebè', E: 'è', META: 'metà' };
  check('Voce: PAPA dentro una frase diventa papà', IAL.UI.spokenText('PAPA BALLA.') === 'papà balla.');
  check('Voce: BEBE diventa bebè e la E verbo diventa è', IAL.UI.spokenText('IL BEBE E BELLO.') === 'il bebè è bello.');
  check('Voce: la lettera E da sola resta e', IAL.UI.spokenText('E') === 'e');
  check('Voce: META diventa metà', IAL.UI.spokenText('META') === 'metà');
  delete IAL.PRONOUNCE_MAP;

  out.push('');
  out.push(fail === 0 ? 'UI TEST SUPERATI (' + pass + ')' : 'UI TEST FALLITI: ' + fail + ' su ' + (pass + fail));
  document.getElementById('summary').textContent = out.join('\n');
})();
</script>
</body>
</html>
